# XcodeGen spec. The .xcodeproj is generated on the build machine:
#   cd ios && xcodegen generate
name: NieNieSlime
options:
  bundleIdPrefix: org.domyweb
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  NieNieSlime:
    type: application
    platform: iOS
    sources:
      # NieNie/Resources/PrivacyInfo.xcprivacy (Apple privacy manifest) rides along with this path: XcodeGen puts every file
      # that is not source code into the resources phase, so it lands in the bundle root like the .wav files beside it
      - path: NieNie
    info:
      path: NieNie/Info.plist
      properties:
        CFBundleDisplayName: 捏捏史萊姆
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # launch screen: an empty shell in the sky colour, so the first frame does not flash white (3-6)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleDarkContent
        # allow 120Hz on ProMotion iPhones
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        # 走路：只有調節台 walkShow 開著、在禮物石按「好」才問；少了這行一呼叫 CMPedometer 就閃退（v2.63 未做 77：拿掉「沾到什麼」，走路帶東西回來預設不做了）
        NSMotionUsageDescription: 用你走的步數決定牠有多有精神。步數只留在這支手機上。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.domyweb.nienieslime
        PRODUCT_NAME: NieNieSlime
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: true
    scheme: {}
