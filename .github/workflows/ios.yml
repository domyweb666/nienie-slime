name: iOS

on:
  push:
    branches: [main, swiftui-port]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      testflight:
        description: "Archive, sign and upload to TestFlight"
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile (unsigned)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Build
        run: |
          set +e
          xcodebuild -project ios/NieNieSlime.xcodeproj -scheme NieNieSlime \
            -configuration Release -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1
          status=$?
          grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" build.log | sort -u
          [ $status -eq 0 ] || tail -n 60 build.log
          exit $status

  testflight:
    name: Upload to TestFlight
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-26
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Check secrets are present
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          missing=""
          [ -z "$TEAM_ID" ] && missing="$missing APPLE_TEAM_ID"
          [ -z "$ASC_KEY_ID" ] && missing="$missing ASC_KEY_ID"
          [ -z "$ASC_ISSUER_ID" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$ASC_PRIVATE_KEY" ] && missing="$missing ASC_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Secrets:$missing"
            exit 1
          fi
      - name: Write API key and verify it with App Store Connect
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          python3 -m pip install -q pyjwt cryptography
          python3 - <<'PY'
          import os, re, sys, time, json, urllib.request, urllib.error, jwt
          kid = os.environ["ASC_KEY_ID"].strip()
          iss = os.environ["ASC_ISSUER_ID"].strip()
          key = os.environ["ASC_PRIVATE_KEY"].strip().replace(chr(13), "")
          tmp = os.environ["RUNNER_TEMP"]
          print(f"Key ID: {len(kid)} chars (expect 10). Issuer ID: {len(iss)} chars (expect 36, a UUID with dashes). .p8: {key.count(chr(10)) + 1} lines (expect 6).")
          problems = []
          if not re.fullmatch(r"[0-9A-Z]{10}", kid):
              problems.append("ASC_KEY_ID should be 10 uppercase letters/digits")
          if not re.fullmatch(r"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}", iss):
              problems.append("ASC_ISSUER_ID should be a UUID like 69a6de7e-xxxx-xxxx-xxxx-xxxxxxxxxxxx (not the Key ID, not the Team ID)")
          if not key.startswith("-----BEGIN PRIVATE KEY-----") or not key.endswith("-----END PRIVATE KEY-----"):
              problems.append("ASC_PRIVATE_KEY should be the whole .p8 file including the BEGIN/END lines")
          for q in problems:
              print(f"::error::{q}")
          if problems:
              sys.exit(1)
          with open(f"{tmp}/keys/AuthKey.p8", "w") as f:
              f.write(key + chr(10))
          now = int(time.time())
          token = jwt.encode({"iss": iss, "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"},
                             key, algorithm="ES256", headers={"kid": kid, "typ": "JWT"})
          req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/apps?limit=10",
                                       headers={"Authorization": "Bearer " + token})
          try:
              with urllib.request.urlopen(req) as r:
                  d = json.load(r)
          except urllib.error.HTTPError as e:
              body = e.read().decode(errors="replace")[:600]
              print(f"::error::App Store Connect rejected this key: HTTP {e.code}. {body}")
              if e.code == 401:
                  print("::error::401 means Key ID / Issuer ID / .p8 do not belong together, or the key is an Individual key instead of a Team key. Recreate a Team key (使用者與存取 → 整合 → App Store Connect API → 團隊金鑰), role Admin, and set all three secrets from that same key.")
              sys.exit(1)
          apps = [a["attributes"]["bundleId"] for a in d.get("data", [])]
          print("API key accepted. Apps visible to this key:", apps)
          if "org.domyweb.nienieslime" not in apps:
              print("::warning::org.domyweb.nienieslime is not among the apps this key can see. Create the App in App Store Connect with that Bundle ID first.")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"ASC_KEY_PATH={tmp}/keys/AuthKey.p8" + chr(10))
              f.write(f"ASC_KEY_ID={kid}" + chr(10))
              f.write(f"ASC_ISSUER_ID={iss}" + chr(10))
              f.write("TEAM_ID=" + os.environ["TEAM_ID"].strip() + chr(10))
          PY
      - name: Archive (cloud-managed automatic signing)
        run: |
          set -o pipefail
          xcodebuild -project ios/NieNieSlime.xcodeproj -scheme NieNieSlime \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/NieNieSlime.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive | tail -n 40
      - name: Export and upload to App Store Connect
        run: |
          set -o pipefail
          sed "s/TEAM_ID_PLACEHOLDER/$TEAM_ID/" ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/NieNieSlime.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 40
      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
