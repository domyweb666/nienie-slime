<title>捏捏史萊姆</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: a flat, sunny little field drawn on canvas with the slime in the middle; chunky cartoon chips float top and bottom. One deliberate light look. */
:root{
  --sky:#CDEBFA; --ink:#2E3A2A; --ink-soft:#5E7458; --chip:#FFFFFF; --chip-line:#2E3A2A;
  --chip-on:#2E3A2A; --chip-on-ink:#FFFFFF; --scrim:rgba(30,45,30,.6);
  --display:"Mochiy Pop One","Zen Maru Gothic","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  --ui:"Zen Maru Gothic","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--sky);color:var(--ink);font-family:var(--ui)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.bar{position:fixed;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar>*{pointer-events:auto}
.top{top:0;padding-top:calc(env(safe-area-inset-top,0px) + 14px)}
.bottom{bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}
.brand{display:flex;align-items:baseline;gap:6px;pointer-events:none;-webkit-user-select:none;user-select:none}
.brand b{font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:.04em}
.brand span{font-size:13px;font-weight:700;color:var(--ink-soft);letter-spacing:.14em}
button{font-family:var(--ui);touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer;color:var(--ink)}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.round{width:46px;height:46px;border-radius:50%;border:2.5px solid var(--chip-line);background:var(--chip);display:grid;place-items:center;flex:none;padding:0;box-shadow:0 3px 0 var(--chip-line)}
.round:active{transform:translateY(2px);box-shadow:0 1px 0 var(--chip-line)}
.round svg{width:22px;height:22px}
.group{display:flex;align-items:center;gap:8px;min-width:0}
.mats{display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--chip);border:2.5px solid var(--chip-line);box-shadow:0 3px 0 var(--chip-line);min-width:0}
.mats button{border:0;background:transparent;border-radius:999px;padding:8px 11px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:5px;white-space:nowrap}
.mats button i{width:12px;height:12px;border-radius:50%;display:block;border:2px solid var(--chip-line)}
.mats button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.mats button[aria-pressed="true"] i{border-color:#fff}
.cam{width:60px;height:60px}.cam svg{width:28px;height:28px}
.hint{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 74px);
  padding:8px 16px;border-radius:999px;background:#fff;border:2.5px solid var(--chip-line);font-size:14px;font-weight:700;
  white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis;transition:opacity .6s;pointer-events:none}
.hint.off{opacity:0}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:fl .45s ease-out}@keyframes fl{0%{opacity:.85}100%{opacity:0}}
.photo{position:fixed;inset:0;background:var(--scrim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:calc(env(safe-area-inset-top,0px) + 24px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px))}
.photo img{max-width:100%;max-height:68vh;border-radius:20px;border:6px solid #fff;box-shadow:0 18px 50px rgba(0,0,0,.35);-webkit-touch-callout:default;transform:rotate(-1.5deg)}
.photo p{margin:0;color:#fff;font-size:14px;font-weight:700;text-align:center}
.photo button{border:2.5px solid var(--chip-line);border-radius:999px;padding:11px 26px;font-size:15px;font-weight:700;background:#fff}
.tune{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  bottom:calc(env(safe-area-inset-bottom,0px) + 92px);background:#fff;border:2.5px solid var(--chip-line);border-radius:22px;box-shadow:0 4px 0 var(--chip-line);
  padding:12px 16px 14px;display:flex;flex-direction:column;gap:8px;max-width:460px;margin:0 auto}
.tune-head{display:flex;justify-content:space-between;align-items:baseline}
.tune-head b{font-family:var(--display);font-weight:400;font-size:17px}.tune-head span{font-size:13px;font-weight:700;color:var(--ink-soft)}
.tune label{display:grid;grid-template-columns:1fr auto;grid-template-areas:"name val" "hint hint" "range range";column-gap:8px;font-size:14px;font-weight:700}
.tune small{grid-area:hint;font-size:11.5px;font-weight:500;color:var(--ink-soft)}
.tune input{grid-area:range;width:100%;accent-color:#2E3A2A;margin:2px 0 0}
.tune output{grid-area:val;font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink-soft)}
.tune-actions{display:flex;gap:8px}
.tune-actions button{flex:1;border:2.5px solid var(--chip-line);border-radius:999px;background:#fff;padding:8px;font-size:14px;font-weight:700}
.tune-actions button:first-child{background:var(--chip-on);color:var(--chip-on-ink)}
.tune textarea{width:100%;box-sizing:border-box;font:12px ui-monospace,Menlo,monospace;border:1.5px solid #c9d3c4;border-radius:10px;padding:6px 8px;resize:none;color:var(--ink)}
@media (prefers-reduced-motion: reduce){.flash.go{animation:none}.hint{transition:none}}
@media (max-width:380px){.mats button{padding:8px 8px;font-size:13px}.mats button i{display:none}}
</style>

<canvas id="c" aria-label="史萊姆，可以抓住拉長、按住壓扁、從旁邊推"></canvas>

<div class="bar top">
  <div class="brand"><b>捏捏</b><span>史萊姆</span></div>
  <div class="group">
  <button class="round" id="tbtn" aria-label="調手感" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 6h14M5 12h14M5 18h14"/><circle cx="9" cy="6" r="2.2" fill="#fff"/><circle cx="15" cy="12" r="2.2" fill="#fff"/><circle cx="8" cy="18" r="2.2" fill="#fff"/></svg>
  </button>
  <button class="round" id="sound" aria-label="關閉聲音" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="w1" d="M15.5 9a4 4 0 0 1 0 6"/><path class="w2" d="M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="x" d="M16 9.5l5 5M21 9.5l-5 5" hidden/></svg>
  </button>
  </div>
</div>

<div class="hint" id="hint">抓住拉長・按住壓扁・從旁邊推</div>

<div class="bar bottom">
  <div class="group">
    <div class="mats" role="group" aria-label="史萊姆手感">
      <button id="m-bouncy" aria-pressed="false"><i style="background:#7FE0C2"></i>Q彈</button>
      <button id="m-mochi" aria-pressed="true"><i style="background:#C9B6FF"></i>麻糬</button>
      <button id="m-clay" aria-pressed="false"><i style="background:#FFD86B"></i>黏土</button>
    </div>
    <button class="round" id="reset" aria-label="揉回原形">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4.5h-4.5"/></svg>
    </button>
  </div>
  <button class="round cam" id="cam" aria-label="拍照">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 8h3l1.6-2.2h6.8L17 8h3v11H4z"/><circle cx="12" cy="13.2" r="3.6"/></svg>
  </button>
</div>

<div class="tune" id="tune" hidden>
  <div class="tune-head"><b>調手感</b><span id="tune-mat">麻糬</span></div>
  <label>軟硬<small>越右越容易拉長</small><input type="range" id="t-soft" min="0" max="100"><output id="o-soft"></output></label>
  <label>黏稠<small>越右越像在糖漿裡動</small><input type="range" id="t-damp" min="1" max="16" step=".5"><output id="o-damp"></output></label>
  <label>定型<small>越右越快留住新形狀</small><input type="range" id="t-creep" min="0" max="10" step=".1"><output id="o-creep"></output></label>
  <label>回原形<small>越右越快縮回原樣</small><input type="range" id="t-recover" min="0" max="3" step=".05"><output id="o-recover"></output></label>
  <label>抓取範圍<small>手指抓住的面積</small><input type="range" id="t-grab" min=".2" max=".8" step=".02"><output id="o-grab"></output></label>
  <div class="tune-actions"><button id="t-copy">複製數值</button><button id="t-default">恢復預設</button></div>
  <textarea id="t-out" readonly rows="2" aria-label="目前的手感數值"></textarea>
</div>

<div class="flash" id="flash"></div>
<div class="photo" id="photo" hidden>
  <img id="shot" alt="史萊姆的照片">
  <p>長按照片，就能儲存或分享</p>
  <button id="close">再玩一下</button>
</div>

<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,DPR,R,GROUND;

/* materials: soft = how stretchy, plastic = how much of a stretch it keeps, yield = how far before it starts keeping it */
/* feel parameters (the tuning panel edits these live):
   soft = how easily it stretches, damp = how thick/gooey it moves, creep = how quickly it settles into a new shape,
   recover = how strongly it creeps back to its original form, grab = how big an area your finger takes hold of, snap = pull distance before it lets go */
const DEF={
  bouncy:{soft:9e-5,damp:3.5,creep:.8,recover:1.6,grab:.42,snap:2.8,pitch:1.12,
    base:'#7FE0C2',shade:'#4FB99E',line:'#2B6E61',light:'#E9FFF7',cheek:'#FF9AAE'},
  mochi:{soft:2.2e-4,damp:7,creep:2.6,recover:.35,grab:.4,snap:3.4,pitch:.98,
    base:'#C9B6FF',shade:'#9E86E6',line:'#4E3C8F',light:'#FAF6FF',cheek:'#FF97C0'},
  clay:{soft:3.2e-4,damp:10,creep:6,recover:.02,grab:.38,snap:9,pitch:.86,
    base:'#FFD86B',shade:'#EDB23C',line:'#8A5A12',light:'#FFF8DC',cheek:'#FF9C7A'}
};
const MATS={};for(const k in DEF)MATS[k]={...DEF[k]};
let mat=MATS.mochi;

/* ---------- body: a triangle lattice inside an original drop-with-a-tip shape ---------- */
let N=0,held,stuck,SX,SY,X,Y,PX,PY,VX,VY,IX,IY,tris=[],edges=[],longs=[],loop=[],grabbed=null;
function build(){
  const s=R/6,rr=a=>{const c=Math.cos(a),sn=Math.sin(a),ry=sn<0?R:R*.74;
    return (1/Math.sqrt((c/(R*1.12))**2+(sn/ry)**2))*(1+.22*Math.exp(-(((a+Math.PI/2)/.3)**2)))};
  const inside=(x,y)=>Math.hypot(x,y)<=rr(Math.atan2(y,x))+.5;
  const idx=new Map(),P=[];
  for(let j=-20;j<=20;j++)for(let i=-20;i<=20;i++){const x=(i+(j&1)*.5)*s,y=j*s*.866;if(inside(x,y)){idx.set(i+','+j,P.length);P.push([x,y,i,j])}}
  const g=(i,j)=>idx.has(i+','+j)?idx.get(i+','+j):-1;
  const T=[];
  for(const [x,y,i,j] of P){const a=g(i,j),r=g(i+1,j),dr=(j&1)?g(i+1,j+1):g(i,j+1),dl=(j&1)?g(i,j+1):g(i-1,j+1);
    if(r>=0&&dr>=0)T.push([a,r,dr]);if(dr>=0&&dl>=0)T.push([a,dr,dl])}
  const used=new Set();T.forEach(t=>t.forEach(k=>used.add(k)));
  const remap=new Map();const Q=[];[...used].sort((a,b)=>a-b).forEach(k=>{remap.set(k,Q.length);Q.push(P[k])});
  N=Q.length;held=new Uint8Array(N);stuck=new Uint8Array(N);SX=new Float64Array(0);X=new Float64Array(N);Y=new Float64Array(N);PX=new Float64Array(N);PY=new Float64Array(N);VX=new Float64Array(N);VY=new Float64Array(N);IX=new Float64Array(N);IY=new Float64Array(N);
  let maxY=-1e9;Q.forEach(q=>maxY=Math.max(maxY,q[1]));
  Q.forEach((q,k)=>{X[k]=W/2+q[0];Y[k]=GROUND-maxY+q[1];IX[k]=q[0];IY[k]=q[1]});
  tris=T.map(t=>{const [a,b,c]=t.map(k=>remap.get(k));return{a,b,c,A0:area(a,b,c),I:[a,b,c]}});
  // rest matrices for the face deformation
  tris.forEach(t=>{const ex=IX[t.b]-IX[t.a],ey=IY[t.b]-IY[t.a],fx=IX[t.c]-IX[t.a],fy=IY[t.c]-IY[t.a],det=ex*fy-fx*ey;t.inv=[fy/det,-fx/det,-ey/det,ex/det]});
  const ek=new Map();
  tris.forEach(t=>[[t.a,t.b],[t.b,t.c],[t.c,t.a]].forEach(([p,q])=>{const k=p<q?p+'_'+q:q+'_'+p;ek.set(k,(ek.get(k)||0)+1)}));
  edges=[...ek.keys()].map(k=>{const [p,q]=k.split('_').map(Number);const L=Math.hypot(X[p]-X[q],Y[p]-Y[q]);return{p,q,L,L0:L,boundary:ek.get(k)===1}});
  longs=[];const qi=new Map();Q.forEach((q,k)=>qi.set(q[2]+','+q[3],k));
  Q.forEach((q,k)=>{[[2,0],[0,2],[1,2],[-1,2]].forEach(([di,dj])=>{const o=qi.get((q[2]+di)+','+(q[3]+dj));if(o!==undefined){const L=Math.hypot(X[k]-X[o],Y[k]-Y[o]);longs.push({p:k,q:o,L,L0:L})}})});
  // boundary loop
  const adj=new Map();edges.filter(e=>e.boundary).forEach(e=>{(adj.get(e.p)||adj.set(e.p,[]).get(e.p)).push(e.q);(adj.get(e.q)||adj.set(e.q,[]).get(e.q)).push(e.p)});
  let start=[...adj.keys()][0],prev=-1,cur=start;loop=[];
  do{loop.push(cur);const nx=adj.get(cur).find(o=>o!==prev);prev=cur;cur=nx}while(cur!==start&&loop.length<=adj.size);
  // face anchors in the rest shape
  anchors={eyeL:anchor(-.34*R,-.06*R),eyeR:anchor(.34*R,-.06*R),mouth:anchor(0,.13*R),hl:anchor(-.5*R,-.48*R)};
  grabs.clear();
}
let anchors={};
function area(a,b,c){return .5*((X[b]-X[a])*(Y[c]-Y[a])-(X[c]-X[a])*(Y[b]-Y[a]))}
function anchor(x,y){let best=null,bd=1e9;
  for(const t of tris){const cx=(IX[t.a]+IX[t.b]+IX[t.c])/3,cy=(IY[t.a]+IY[t.b]+IY[t.c])/3,d=Math.hypot(cx-x,cy-y);if(d<bd){bd=d;best=t}}
  const t=best,v0x=IX[t.b]-IX[t.a],v0y=IY[t.b]-IY[t.a],v1x=IX[t.c]-IX[t.a],v1y=IY[t.c]-IY[t.a],v2x=x-IX[t.a],v2y=y-IY[t.a];
  const d00=v0x*v0x+v0y*v0y,d01=v0x*v1x+v0y*v1y,d11=v1x*v1x+v1y*v1y,d20=v2x*v0x+v2y*v0y,d21=v2x*v1x+v2y*v1y,den=d00*d11-d01*d01;
  const bv=(d11*d20-d01*d21)/den,bw=(d00*d21-d01*d20)/den;return{t,u:1-bv-bw,v:bv,w:bw}}
function anchorPos(an){const t=an.t;return[X[t.a]*an.u+X[t.b]*an.v+X[t.c]*an.w,Y[t.a]*an.u+Y[t.b]*an.v+Y[t.c]*an.w]}
function defGrad(t){const ex=X[t.b]-X[t.a],ey=Y[t.b]-Y[t.a],fx=X[t.c]-X[t.a],fy=Y[t.c]-Y[t.a],[i0,i1,i2,i3]=t.inv;
  let a=ex*i0+fx*i2,b=ex*i1+fx*i3,c=ey*i0+fy*i2,d=ey*i1+fy*i3;
  const nrm=Math.hypot(a,b,c,d)/Math.SQRT2;if(nrm>2.2){const k=2.2/nrm;a*=k;b*=k;c*=k;d*=k}
  return[a,b,c,d]}
// average deformation of the triangles around a point so the face bends smoothly
function localF(an){const [px,py]=anchorPos(an);let sa=0,sb=0,sc=0,sd=0,sw=0;
  for(const t of tris){const cx=(X[t.a]+X[t.b]+X[t.c])/3,cy=(Y[t.a]+Y[t.b]+Y[t.c])/3,d=Math.hypot(cx-px,cy-py);if(d>R*.45)continue;
    const w=1-d/(R*.45),F=defGrad(t);sa+=F[0]*w;sb+=F[1]*w;sc+=F[2]*w;sd+=F[3]*w;sw+=w}
  return sw?[sa/sw,sb/sw,sc/sw,sd/sw]:[1,0,0,1]}

/* ---------- touch ---------- */
const grabs=new Map();
function pos(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function insideBody(x,y){let c=false;for(let i=0,j=loop.length-1;i<loop.length;j=i++){const a=loop[i],b=loop[j];
  if((Y[a]>y)!==(Y[b]>y)&&x<(X[b]-X[a])*(y-Y[a])/(Y[b]-Y[a])+X[a])c=!c}return c}
function nearBody(x,y){if(insideBody(x,y))return true;for(const k of loop)if(Math.hypot(X[k]-x,Y[k]-y)<R*.22)return true;return false}
cv.addEventListener('pointerdown',e=>{e.preventDefault();audio();try{cv.setPointerCapture(e.pointerId)}catch(_){}
  const {x,y}=pos(e),now=performance.now();face.last=now;if(face.sleepy>.5)face.wake=1;
  const g={x,y,sx:x,sy:y,t0:now,moved:0,still:0,press:0,lx:x,ly:y,mode:'push',ids:[],w:[],ax:[],ay:[],creak:0};
  if(nearBody(x,y)){g.mode='grab';const Rg=R*mat.grab;let nearest=-1,nd=1e9;
    for(let k=0;k<N;k++){const d=Math.hypot(X[k]-x,Y[k]-y);if(d<nd){nd=d;nearest=k}if(d<Rg){const w=(1-(d/Rg)**2)**2;g.ids.push(k);g.w.push(w);g.ax.push(X[k]-x);g.ay.push(Y[k]-y)}}
    if(!g.ids.includes(nearest)){g.ids.push(nearest);g.w.push(1);g.ax.push(X[nearest]-x);g.ay.push(Y[nearest]-y)}
    const mx=Math.max(...g.w);g.w=g.w.map(w=>w/mx);sfxSquish(.45)}
  grabs.set(e.pointerId,g)},{passive:false});
cv.addEventListener('pointermove',e=>{const g=grabs.get(e.pointerId);if(!g)return;const {x,y}=pos(e);g.moved+=Math.hypot(x-g.x,y-g.y);g.x=x;g.y=y;face.last=performance.now()});
function release(e){const g=grabs.get(e.pointerId);if(!g)return;grabs.delete(e.pointerId);
  const dur=performance.now()-g.t0;
  if(g.mode==='grab'||g.mode==='press'){
    if(dur<220&&g.moved<12){for(let k=0;k<N;k++){const d=Math.hypot(X[k]-g.x,Y[k]-g.y);if(d<R*.5){const w=(1-d/(R*.5))**2;VY[k]+=R*2.2*w;VX[k]+=(X[k]-g.x)*2*w}}
      face.expr='surprise';face.exprT=.45;voice('pu')}
    else{const st=stretchOf(g);sfxBoing(Math.min(1,.25+st*.35));if(st>1.3){face.expr='happy';face.exprT=1.2;if(Math.random()<.6)voice('happy')}}
  }}
cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);
cv.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('gesturestart',e=>e.preventDefault());
function centroid(){let cx=0,cy=0;for(let k=0;k<N;k++){cx+=X[k];cy+=Y[k]}return[cx/N,cy/N]}
function stretchOf(g){const [cx,cy]=centroid();return Math.hypot(g.x-cx,g.y-cy)/R}

/* ---------- solver (XPBD) ---------- */
const GRAV=()=>R*11;
function solve(dt){
  const sub=10,h=dt/sub,aE=mat.soft/(h*h),aL=mat.soft*1.2/(h*h),aA=0,gr=GRAV(),maxStep=R*.045;
  for(const g of grabs.values()){g.ox=g.sx0===undefined?g.x:g.sx0;g.oy=g.sy0===undefined?g.y:g.sy0}
  for(let s=0;s<sub;s++){

const softToSlider=v=>Math.round(Math.log(v/2e-5)/Math.log(40)*100),sliderToSoft=x=>2e-5*Math.pow(40,x/100);
const fields=['soft','damp','creep','recover','grab'],fmt={soft:v=>softToSlider(v),damp:v=>v.toFixed(1),creep:v=>v.toFixed(1),recover:v=>v.toFixed(2),grab:v=>v.toFixed(2)};
function syncTune(){document.getElementById('tune-mat').textContent=NAMES[keyOf()];
  for(const f of fields){const el=document.getElementById('t-'+f);el.value=f==='soft'?softToSlider(mat.soft):mat[f];document.getElementById('o-'+f).textContent=fmt[f](mat[f])}
  document.getElementById('t-out').value=JSON.stringify({手感:NAMES[keyOf()],軟硬:softToSlider(mat.soft),黏稠:+mat.damp.toFixed(1),定型:+mat.creep.toFixed(1),回原形:+mat.recover.toFixed(2),抓取範圍:+mat.grab.toFixed(2)})}
for(const f of fields)document.getElementById('t-'+f).addEventListener('input',e=>{const v=+e.target.value;mat[f]=f==='soft'?sliderToSoft(v):v;syncTune()});
const tb=document.getElementById('tbtn'),tp=document.getElementById('tune');
tb.addEventListener('click',()=>{tp.hidden=!tp.hidden;tb.setAttribute('aria-pressed',String(!tp.hidden));syncTune()});
document.getElementById('t-default').addEventListener('click',()=>{const k=keyOf();Object.assign(MATS[k],DEF[k]);syncTune()});
document.getElementById('t-copy').addEventListener('click',e=>{const ta=document.getElementById('t-out'),btn=e.currentTarget;
  const done=()=>{btn.textContent='已複製';setTimeout(()=>btn.textContent='複製數值',1400)};
  try{navigator.clipboard.writeText(ta.value).then(done,()=>{ta.focus();ta.select()})}catch(_){ta.focus();ta.select()}});
syncTune();
const sb=document.getElementById('sound');
sb.addEventListener('click',()=>{audio();muted=!muted;if(master)master.gain.value=muted?0:.85;sb.setAttribute('aria-pressed',String(muted));sb.setAttribute('aria-label',muted?'打開聲音':'關閉聲音');
  sb.querySelector('.x').hidden=!muted;sb.querySelector('.w1').style.display=muted?'none':'';sb.querySelector('.w2').style.display=muted?'none':''});
const flash=document.getElementById('flash'),photo=document.getElementById('photo'),shot=document.getElementById('shot');
document.getElementById('cam').addEventListener('click',()=>{audio();draw();const off=document.createElement('canvas');off.width=cv.width;off.height=cv.height;const o=off.getContext('2d');o.drawImage(cv,0,0);
  o.font=`700 ${16*DPR}px "Mochiy Pop One","Zen Maru Gothic",sans-serif`;o.fillStyle='rgba(60,100,50,.6)';o.textAlign='right';o.fillText('捏捏史萊姆',off.width-18*DPR,(GROUND+R*.6)*DPR);
  try{shot.src=off.toDataURL('image/jpeg',.92)}catch(e){return}sfxShutter();flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go');setTimeout(()=>{photo.hidden=false},250)});
document.getElementById('close').addEventListener('click',()=>{photo.hidden=true});
const hintEl=document.getElementById('hint');setTimeout(()=>hintEl.classList.add('off'),7000);
let rzT=null,lw=innerWidth,lh=innerHeight;addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(Math.abs(innerWidth-lw)>2||Math.abs(innerHeight-lh)>160){lw=innerWidth;lh=innerHeight;resize()}},150)});
resize();requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame)});
})();

</script>
