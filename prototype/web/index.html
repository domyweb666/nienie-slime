<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>捏捏史萊姆｜形狀匹配原型 v2.38</title>
<style>
:root{
  --sky:#CDEBFA; --sky2:#E6F5FD; --grass:#C5E8A8; --grass-line:#A9D68A;
  --body:#FFD96B; --shade:#F0B64A; --line:#8B5A20; --hi:#FFF6D6; --speck:#FFFFFF; --eye:#3A2614;
  --ink:#2E3A2A; --ink-soft:#5E7458; --chip:#FFFFFF; --chip-line:#2E3A2A; --chip-on:#2E3A2A; --chip-on-ink:#FFFFFF;
  --ui:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;
}
*{-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--sky);color:var(--ink);font-family:var(--ui);touch-action:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.bar{position:fixed;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.bar>*{pointer-events:auto}
.top{top:0;padding-top:calc(env(safe-area-inset-top,0px) + 14px)}
.bottom{bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}
.brand{font-weight:800;font-size:22px;letter-spacing:.04em;display:flex;align-items:baseline;gap:8px;padding:6px 2px}
.brand span{font-size:12px;font-weight:700;color:var(--ink-soft);letter-spacing:.14em}
.round{width:46px;height:46px;border-radius:50%;border:2.5px solid var(--chip-line);background:var(--chip);display:grid;place-items:center;flex:none;padding:0;font-size:18px}
.round[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.mats{display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--chip);border:2.5px solid var(--chip-line);min-width:0}
.mats button{border:0;background:transparent;border-radius:999px;padding:8px 9px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:5px;white-space:nowrap;color:var(--ink)}
.mats button i{width:10px;height:10px;border-radius:50%;display:inline-block}
.mats button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.hint{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 146px);
  padding:8px 16px;border-radius:999px;background:#fff;border:2.5px solid var(--chip-line);font-size:14px;font-weight:700;
  transition:opacity .6s;pointer-events:none}
.hint.off{opacity:0}
.view{position:fixed;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 68px);display:grid;gap:4px;justify-items:start;z-index:3;pointer-events:none}
.view .vrow{display:flex;align-items:center;gap:5px;pointer-events:auto;max-width:100%}
.view b{font-size:12px;font-weight:800;color:var(--ink);background:rgba(255,255,255,.72);border-radius:8px;padding:2px 5px}
.view .seg{display:flex;gap:1px;padding:2px;border-radius:999px;background:rgba(255,255,255,.86);border:1.5px solid var(--chip-line)}
.view button{border:0;background:transparent;border-radius:999px;padding:5px 8px;font-size:12.5px;font-weight:700;white-space:nowrap;color:var(--ink)}
.view button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.view .plain{background:rgba(255,255,255,.86);border:1.5px solid var(--chip-line)}
.view.shut .vrow:not(.vkeep){display:none}
.view.shut .vkeep>:not(#v-toggle){display:none}
.tune{max-height:calc(100vh - 210px);overflow:auto;position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  bottom:calc(env(safe-area-inset-bottom,0px) + 92px);background:#fff;border:2.5px solid var(--chip-line);border-radius:22px;
  padding:14px 16px 12px;display:grid;gap:10px;z-index:5}
.tune.hidden{display:none}
.tune-head{display:flex;justify-content:space-between;align-items:baseline}
.tune-head b{font-size:17px}.tune-head span{font-size:12px;font-weight:700;color:var(--ink-soft)}
.tune label{display:grid;grid-template-columns:1fr auto;grid-template-areas:"name val" "hint hint" "range range";column-gap:8px;font-size:14px;font-weight:700}
.tune small{grid-area:hint;font-size:11.5px;font-weight:500;color:var(--ink-soft)}
.tune input[type=range]{grid-area:range;width:100%;accent-color:#2E3A2A;margin:2px 0 0}
.tune output{grid-area:val;font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink-soft)}
.tune-actions{display:flex;gap:8px}
.tune-actions button{flex:1;border:2.5px solid var(--chip-line);border-radius:999px;background:#fff;padding:8px;font-size:14px;font-weight:700;color:var(--ink)}
.tune-actions button:first-child{background:var(--chip-on);color:var(--chip-on-ink)}
.tune textarea{width:100%;box-sizing:border-box;font:12px ui-monospace,Menlo,monospace;border:1.5px solid #c9d3c4;border-radius:10px;padding:6px 8px;resize:none;color:var(--ink)}
#walk-ask{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(46,58,42,.28)}
#walk-ask.on{display:flex}
#walk-ask .card{max-width:300px;background:var(--chip);border:2px solid var(--chip-line);border-radius:22px;padding:22px 20px 16px;text-align:center;color:var(--ink);font-size:17px;line-height:1.5;font-weight:600}
#walk-ask .btns{display:flex;gap:10px;margin-top:16px}
#walk-ask button{flex:1;min-height:44px;border-radius:999px;border:2px solid var(--chip-line);background:var(--chip);color:var(--ink);font:inherit;font-size:16px}
#walk-ask button#walk-yes{background:var(--chip-on);color:var(--chip-on-ink)}
</style>
</head>
<body>
<div id="walk-ask" role="dialog" aria-modal="true"><div class="card">牠想跟你出門。<br>要讓牠知道你走了多少路嗎？<div class="btns"><button id="walk-no">先不要</button><button id="walk-yes">好</button></div></div></div>
<canvas id="cv"></canvas>

<div class="bar top">
  <div class="brand" id="brand">捏捏<span>v2.38 <i id="v-fps" style="font-style:normal"></i></span></div>
  <button class="round" id="b-mute" aria-pressed="false" title="音樂和音效">🎵</button>
</div>

<div class="view" id="view">
  <div class="vrow"><b>搖</b><span class="seg" data-k="shk"><button data-v="settle">沉澱</button><button data-v="eat">散出來吃回來</button></span></div>
  <div class="vrow vkeep"><b>背景</b><span class="seg" data-k="bg"><button data-v="blue">藍</button><button data-v="day">白天</button><button data-v="night">夜晚</button></span><button class="plain" id="v-toggle">收起</button></div>
</div>

<div class="hint" id="hint">捏它、拉它、揉它；搖一搖手機再放著</div>

<div class="bar bottom">
  <div class="mats" role="group" aria-label="史萊姆" id="slimes"></div>
  <button class="round" id="b-reset" title="回原形">↺</button>
</div>

<div class="tune hidden" id="tune">
  <div class="tune-head"><b>調整面板</b><span>長按「捏捏」開關</span></div>
  <div id="sliders"></div>
  <div class="tune-actions" id="cands"><button data-c="6">候選 6 黏滯 0.03</button><button data-c="19">候選 19 凍住</button><button data-c="2">候選 2 特別回彈</button><button data-c="41">41 對照：關橫檔</button><button data-c="21">21 回家慢</button><button data-c="22">22 放手餘韻</button><button data-c="23">23 呼吸</button><button data-c="25">25 滑脫</button><button data-c="26">26 黏連</button><button data-c="27">27 局部鼓</button><button data-c="33">33 家 0.46</button><button data-c="34">34 描邊粗細</button><button data-c="27v">v2.7 對照（舊外形）</button><button data-c="212">v2.12 對照（鏡頭最遠 0.45）</button><button data-c="219">v2.19 對照（不跟手、凹痕慢、沒有印象）</button><button data-c="220">v2.20 對照（整團只跟三成五）</button><button data-c="221">v2.21 對照（不出聲）</button><button data-c="222">v2.22 對照（沒眼睛、不睡、不回節奏、跳過來）</button><button data-c="223">v2.23 對照（身體小、反應小、揉沒反應）</button><button data-c="226">v2.26 對照（有眼睛、沒觸手、不變色）</button><button data-c="225">v2.25 對照（一碰就抓、凹痕小）</button><button data-c="224">v2.24 對照（放手一閃就回去）</button></div>
  <div class="tune-actions"><button id="tm-jelly">材質：果凍</button><button id="tm-mochi">材質：麻糬</button><button id="tm-clay">材質：黏土</button></div>
  <div class="tune-actions"><button id="b-float" aria-pressed="true">懸空（多米定案）</button><button id="t-intro">重播開場</button><button id="t-copy">複製數值</button><button id="t-close">收起</button></div>
  <div class="tune-actions"><button id="t-walk-s">走路：假裝 800 步</button><button id="t-walk-b">走路：假裝 3500 步</button><button id="t-walk-0">走路：全部重來</button></div>
  <div class="tune-actions"><button id="t-shake-1">搖：假裝搖一下</button><button id="t-shake-3">搖：假裝搖三下</button><button id="t-shake-0">搖：立刻沉澱</button></div>
  <textarea id="t-out" readonly rows="3" aria-label="目前的手感數值"></textarea>
</div>

<script src="sfx/engine.js"></script>
<script>
'use strict';
/* =========================================================
   捏捏史萊姆 v2：形狀匹配軟體（Müller 2005）＋塑性＋活物感
   - 身體 = 一群粒子；每幀每個區塊算出「最接近的剛體／線性擺放」，粒子被拉回去
   - 永遠拉得回來、不爆、不打結（輪廓由邊界粒子依原始順序連成）
   - 塑性：變形超過 yield 就慢慢改參考形狀（留形）；沒碰時參考形狀回原樣
   - 活物：沒碰時呼吸、慢搖、偶爾抖、懸空時上下浮
   - v2.3（手感精修提案第一批，2026-11-01）：按下去那塊往四周攤開（接觸點先凹，側視圖用壓扁表現）；
     放手強度看「拉多遠」與「甩多快」取大；抓住 0.2 秒內純彈性、0.6 秒後才全速記形（輕按回彈，揉捏即留形）；
     揉回原形用動畫不瞬移；系統收走觸控時安靜放開
   - v2.4（第二批候選，2026-11-01）：idleFreeze（碰到時活物感凍住不歸零）、specialEvery（偶發特別回彈）兩個開關，
     預設關（對照值）；面板「候選」按鈕一次套一條。觸覺類候選（12、13、14、9、38）只在 Swift 版
   - v2.5（提案第 41 條，2026-11-01）：觸手橫檔（tentRung）＋中軸不折返（tentAxis），抓觸手根部往尖端推不再對折；
     兩個都預設開，面板「41 對照：關橫檔」關掉當對照。量法在 selftest.js 的 T11（固定情境網格）
   - v2.6（第三批前五條，2026-11-01）：遊走走一段用 smoothstep 加減速、觸手拖尾（tail，寫在參考形狀上）、減少動態時遊走 ×0.25；
     第 30、32、35 條（顏色淡入、提示只前三次、待機 60Hz）只在 Swift 版。量法在 selftest.js 的 T12
   - v2.7（第三批其餘，2026-11-01）：全部做成參數、預設是對照值：21 回家彈簧（homeK）、22 放手餘韻（afterglow）、23 呼吸週期／不對稱／被摸久變深、
     24 兩指捏 squish 事件（預設開）、25 拉太遠滑脫（slip）、26 放手黏連（stick）、27 局部面積壓力（localArea）、33 家的高度（homeFrac）、
     34 描邊粗細隨壓縮（inkVar）；15、17、36 只在 Swift 版。量法在 selftest.js 的 T13 到 T16
   - v2.8（多米真機回報 build 46，2026-11-01）：蠕動改成平滑亂數（輪廓 2 到 5 階＋兩個繞著跑的鼓包，morph），幅度約兩倍；
     黏土抓到就記形（dwell 0／0.1、creep 6）、被抓的觸手也記形（tentMem，用整身座標、記住的形狀也套橫檔中軸與彎曲上限），
     放著約 10 秒退（recover 0.3）。面板「v2.7 對照」換回原本的。量法在 selftest.js 的 T17、T18
   - v2.9（多米第二次真機回報，2026-11-01）：沒有固定觸手（limbs 0），改成會伸縮的偽足（pods，隨機方向、上方也會長，伸 40% 停 20% 縮 40%）；
     水母呼吸（jelly，3 秒一縮一放，收縮快放鬆慢，收縮時上浮）；按鈕拿掉硬陰影。
   - v2.10（多米看網頁版，2026-11-01）：自己動放慢（idlePace 0.45）；自由塑形：黏土拉伸上限 8R、記形上限 4R（memMax）、
     被抓那塊 85% 聽手指（grabHold）、手指附近整身座標記形放寬到約 1.1R、繩子上限跟著記住的形狀；身體縮到畫面寬 0.22（bodySize）。量法在 T21、T22
   - v2.11（多米真機 build 53，2026-11-01）：邊不能穿邊（ringGuard）；整塊跟手（grabK 1.2）、整團記形（nearR 3）；自身形變調小
     （偽足 0.6R、呼吸 0.06、上浮 0.08R、蠕動 0.05R）；一壓就攤平（pressFlat：從上半部往下壓，下面有看不見的桌面）。量法在 T23、T24
   - v2.12（多米真機 build 55，2026-11-01）：一壓就攤平預設關；鏡頭跟著拉遠（形狀變大畫面自動縮小、最小 0.45 倍，牆放在最遠鏡頭的邊；
     手指存螢幕座標每幀換回世界，按在畫面邊不放就會一直拉長）。量法在 T25面板「v2.7 對照（舊外形）」換回海星外形與舊的記形。量法在 T19、T20
   - v2.13（多米 2026-11-01：鏡頭無限拉遠、拉多大推多遠）：鏡頭沒有下限、沒有牆；黏土拉伸 20R、記形 12R；點加密到每個半徑 12 個（拉到 8R 時外圈太疏、尾端交叉）；抓著時鏡頭留邊，形狀佔畫面七成就開始退（camFill 0.7）。面板「v2.12 對照」換回去。量法在 T26
   - v2.14（多米真機 build 59，2026-11-01）：黏土回原形 0.05（回彈太快）；從身體裡面抓也拉得動（grabReach：手指一動往拉的方向補抓一條到外圈）。量法在 T27、T28
   - v2.15（多米真機 build 61，2026-11-01）：手指在世界裡只跟著真正的移動走（鏡頭退時停著的手指不再被往外帶，抽搐的源頭）；黏土拉伸 7R、記形 5R（超過約 8.5R 會抖）；點一下留凹痕（dent）。量法在 T29、T30
   - v2.16（多米 2026-11-01：按壓動畫像兒戲）：整團被壓薄攤開（面積＋手指附近往外推）、凹痕用周圍粒子擬合跟著身體變形並改成柔邊漸層、40 毫秒到六成再照材質沉、放手照材質回彈、亮光被擠開、影子變深；面板 press2=0 回 v2.15。量法在 T31
   - v2.17（多米 2026-11-01：開場從遠處一跳一跳跑過來；鏡頭不要把史萊姆釘在中間，它會移動、有時跑出畫面，鏡頭慢慢跟）：intro 開場 4 跳（真重力＋看不見的地板，遠近用畫面縮放）、碰一下就到家；camFollow 鏡頭跟隨（離中心超過 followZone 才追、彈簧 followSpeed、抓著時不動）；遊走改成從現在的位置往外走、每 4 次約 1 次走遠走快；背景光點 specks 固定在遠處（視差 0.55），看得出鏡頭在動。量法在 T32
   - v2.18（多米 2026-11-02：一直停在中央，要上下左右走；被拉扯想逃、舒服時呼嚕）：遊走 0.5R/s、停 0.8 到 3 秒、上下走得開；鏡頭等快出畫面（0.8）才追、追到 0.35 內就停；心情兩個數字（舒服 c、激動 a）：輕揉 1 秒以上舒服上升、攤軟、呼吸慢深、iPhone 呼嚕；揉完放手開心：挺高、偽足搖 4 下、小跳；拉超過 1.5R 撐 0.5 秒想逃：往回拔河、反方向伸兩條偽足、發抖，放手往反方向衝出去；1 秒內戳 3 下閃開。量法在 T33
   - v2.19（多米 build 73：沒有活物感、不像生物；下方影子有必要嗎）：life2 總開關＋A1 到 A8（提案 .uiux/04-手感/活物感提案-暫定.md）。
     休息／張望／出發／到了，休息佔四到六成、蠕動三成、不再隨機長偽足與亂抖；張望伸一條偽足探，七成往那邊走；一縮一衝（蓄力、收縮往前衝、
     放鬆滑停、到了往前晃）；碰著也在呼吸、按在空白處不凍住；晚一拍才縮（會習慣）、拉完甩一甩；呼吸快慢不一、會嘆氣、跑完會喘；
     放手後探你手指離開的地方、碰旁邊空白處會轉過去探；不畫影子。記形改跟「表演縮放後的參考形狀」比（PSM）。量法在 T34
   - v2.20（多米 build 75：拖的時候只有形變沒有位移；點它的凹回復太久；沒有跟人互動的感覺，要依人的行為產生二階效應）：D1 抓著時家跟著手指移 drag 成（drag 0 回 v2.19）；D2 凹痕有自己的回復速度 dentFade（10 回 v2.19）；
     印象 imp（熟、戒，這一次打開 app 的期間累積，背景 10 分鐘歸零）＋C1 手指放旁邊、C2 逗它、C3 跟手看印象、C4 討摸、C5 被粗暴之後（提案 .uiux/04-手感/互動與拖拉提案-暫定.md）。量法在 selftest T35

  ['lifeHeld','A4 碰著也在呼吸','1：抓著按著時呼吸照跑；按在空白處不會整隻凍住；0：v2.18 一碰全停',0,1,1],
  ['lifeFlinch','A5 晚一拍才縮','1：碰到 0.1 到 0.25 秒後自己縮一下，連續碰會習慣、越縮越小；大力拉完放手甩一甩；0 關',0,1,1],

  ['shadow','A8 影子','1：畫影子（v2.18）；0：不畫（v2.19：懸空又上下左右走，影子讓空間前後矛盾）。活物總開關 0 時一律畫',0,1,1],

  ['imp','印象 v2.20','1：它記得你這一次怎麼對它（熟、戒），關掉 app 或背景 10 分鐘歸零；底下 C1 到 C5 只在這裡是 1、活物 v2.19 也是 1 時有用；0 回 v2.19',0,1,1],
  ['impC1','C1 手指放旁邊','1：手指按在它旁邊不動，熟的時候游過來用偽足碰你的手指（很熟時整團貼過來蹭），戒的時候退開、偽足指著你；0：v2.19 只探',0,1,1],
  ['impC2','C2 逗它','1：手指在旁邊慢慢移，偽足跟著轉；熟的時候追，你停下來它撲過去；不熟時手指動太快它嚇一下；0 關',0,1,1],
  ['impC3','C3 跟手看印象','1：拖它時熟的跟得多（五成）、戒的跟得少（一成五），戒很高時拖久了會掙脫；用力扯想逃時跟得少；0：一律照 D1',0,1,1],
  ['impC4','C4 討摸','1：揉到呼嚕放手後，它往你手指離開的地方伸偽足、挪過去；5 秒內再碰，呼嚕來得快；0 關',0,1,1],
  ['impC5','C5 被粗暴之後','1：戒高時被碰縮得大、縮得早，溫柔碰幾次慢慢放心；沒碰時熟的往你最後摸的地方探、戒的往反方向；0 關',0,1,1],
  ['e1','E1 它會出聲','v2.22：被戳「噗」、被揉「嗯～」、被扯「嗯嗯」、開心「噗咿」、討摸「嗯？」、搔癢咯咯笑、打招呼；熟的高一點、戒的低一點；0 關。以下 E1 到 E4 只在活物 v2.19 是 1 時有用',0,1,1],
  ['e2','E2 動作都有它的回應','1：點它，它朝你的手指傾一下；按著不動 0.35 秒，它往你的手指推一下；手指放在它身上不動，它慢慢蹭你；快速小幅度來回撥（搔癢）它扭來扭去，撥太久會掙脫躲開；戒的時候被拖會扒著反方向；0 關',0,1,1],
  ['e3','E3 看得出印象','1：熟起來快三到四倍（揉 5 秒、乖乖被拖兩次就看得出差別）；熟的圓一點、挺一點、顏色偏暖、呼吸慢；戒的扁一點、顏色淡一點；0 關',0,1,1],
  ['cling','黏牆（v2.36）','1（多米 11-07：像章魚黏在牆上，捏下來會抵抗）：把牠慢慢放在窗框旁邊會黏住，貼牆那圈像吸盤釘在牆上，8 到 15 秒後自己爬下來；抓著往外拉，拉開超過一段（熟的 1R、戒的 1.5R）才一顆一顆剝開，眼睛 > <、發抖，剩最後幾顆一起放掉彈回手指；放手時還沒剝完就彈回牆上。牠自己不會去窗框（只跟碗互動照舊）。0 回 v2.35：只跟碗互動時放在窗框旁邊不會黏',0,1,1],
  ['trKeep','熟留下來（v2.34）','1（多米 11-07 定位：陪伴寵物要記得你）：熟每隻分開存在這支手機，關掉、隔天再開都還在，走得少、幾天沒來都不會掉；戒照樣只活在這一次（背景 10 分鐘歸零）；0 回 v2.33：熟跟戒一起歸零。切了重新整理才生效',0,1,1],
  ['one','一隻為主（v2.33）','1（多米 11-07：定位是陪伴寵物，只養一隻，留芋圓）：底部那排四隻不顯示，一開始就是芋圓；她的材質未定（多米 11-07：還不知道什麼手感最好），預設黏土只是佔位，「材質」三顆按鈕隨時切，等材質盲測；0 回四隻（蜜蜜、薄荷、芋圓、桃桃），重新整理才生效',0,1,1],
  ['excite','興奮（運動多，v2.32）','-1：自動，照今天走路帶回幾件（0 或 1 件平常、2 件精神好、3 件很興奮）；0 到 3 假裝今天帶回幾件。只在沒碰牠時看得出來：休息短、走得快、探得勤、來找你多、呼嚕來得快、回家進碗前小跳、眨眼快看你多；抓著牠時手感一字不動（提案 興奮提案-暫定.md）',-1,3,1],
  ['e4','E4 來找你','1：熟的時候你 10 到 20 秒沒碰它，它游到畫面前面揮一下偽足、哼一聲，再回去休息；一次打開最多 3 次；0 關（碰到不做清單的「主動找你」，多米 11-02 決定留著）',0,1,1],
  ['eyes','眼睛 v2.23','1：兩顆小眼睛（多米 11-02：加表情看看，只要眼睛）。看你的手指、會眨眼；被捏瞇起來、被扯擠成 > <、呼嚕和開心彎成 ∩、睡著閉成 ∪、戒的時候睜大；0 回沒有臉',0,1,1],
  ['sleep','B2 睡著','1：40 秒沒人碰（含點空白處），休息時慢慢閉眼睡著：呼吸慢一倍半、深一點、攤軟、不走；碰它會嚇醒（縮大一點、「嗯？」），手指放旁邊 1.2 秒會慢慢醒；0 關',0,1,1],

  ['tickRev','搔癢要幾次折返','1 秒內手指折返幾次算搔癢；v2.24 6（一秒 3 趟），v2.23 4（來回揉就會觸發）',2,12,1],

  ['camCenter','鏡頭對準形狀','1：形狀大到要縮鏡頭、或抓著拉開時，鏡頭對準形狀中心，兩邊都留邊，再抓那一端還有地方拉（v2.15 預設）；0 對準家（拉出去那端貼在畫面邊）',0,1,1],

function buildRungs(){

  // 把兩邊「沿觸手位置 u 最接近」的粒子配成一對（橫檔），記靜止寬度與左右手性（局部切線 × 橫檔向量的正負）。

    if(pos.length<4){RUNGS.push([]);RS.push(1);RUNGREF.push([bnd[0],bnd[0]]);continue}
    const inRun=new Set(pos);let start=pos[0];for(const r of pos){if(!inRun.has((r+nb-1)%nb)){start=r;break}}
    const run=[];for(let m=0;m<pos.length;m++)run.push(bnd[(start+m)%nb]);
    let tipAt=0;for(let m=1;m<run.length;m++)if(TU[run[m]]>TU[run[tipAt]])tipAt=m;

    const ref=[bnd[(start+nb-1)%nb],bnd[(start+pos.length)%nb]];

function buildClusters(){

  clusters=[];
  const cs=R*mat.cSpace,cr=R*mat.cRad;
  for(let cy=-2.6*R;cy<=2.6*R;cy+=cs)for(let cx=-2.6*R;cx<=2.6*R;cx+=cs){
    const idx=[];for(let i=0;i<N;i++)if(Math.hypot(Q0X[i]-cx,Q0Y[i]-cy)<cr)idx.push(i);
    if(idx.length>=5)clusters.push({idx:Int32Array.from(idx),w:1,cs:1,sn:0,xc:0,yc:0,qcx:0,qcy:0});
  }
  const all=[];for(let i=0;i<N;i++)all.push(i);
  globalC={idx:Int32Array.from(all),w:mat.wGlobal,cs:1,sn:0,xc:0,yc:0,qcx:0,qcy:0};
  clusters.push(globalC);

}

  for(let i=0;i<n;i++){const a=bnd[i],b=bnd[(i+1)%n];const c=Math.hypot(X[b]-X[a],Y[b]-Y[a])/Math.max(1e-6,Math.hypot(Q0X[b]-Q0X[a],Q0Y[b]-Q0Y[a]));
    const f=c<1?1+.3*Math.min(1,(1-c)/.4):1-.2*Math.min(1,(c-1)/1.4);w[i]=lw*(1+mat.inkVar*(f-1))}
  return w}
function inkBand(P,lw){const n=P.length,w=inkWidths(lw),S=3,outer=[],inner=[];
  for(let i=0;i<n;i++){const p0=P[(i+n-1)%n],p1=P[i],p2=P[(i+1)%n],p3=P[(i+2)%n];
    const c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6,c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;
    const wa=(w[(i+n-1)%n]+w[i])*.5,wb=(w[i]+w[(i+1)%n])*.5;   // 點 i 的粗細＝鄰接兩段平均，再沿曲線內插
    for(let s=0;s<S;s++){const u=s/S,mu=1-u;
      const bx=mu*mu*mu*p1[0]+3*mu*mu*u*c1x+3*mu*u*u*c2x+u*u*u*p2[0],by=mu*mu*mu*p1[1]+3*mu*mu*u*c1y+3*mu*u*u*c2y+u*u*u*p2[1];

function drawSpecks(col){const v=viewV(),par=.55,zf=1+(CAM.z-1)*par,cell=120,bx=CAM.x*par,by=CAM.y*par;
  const x0=Math.floor((bx+(0-v.x)/zf)/cell)-1,x1=Math.ceil((bx+(W-v.x)/zf)/cell)+1,y0=Math.floor((by+(0-v.y)/zf)/cell)-1,y1=Math.ceil((by+(H-v.y)/zf)/cell)+1;
  const hs=(a,b,c)=>{let n=Math.imul(a,374761393)+Math.imul(b,668265263)+Math.imul(c,2147483647);n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967296};

    const sx=(i*cell+hs(i,j,2)*cell-bx)*zf+v.x,sy=(j*cell+hs(i,j,3)*cell-by)*zf+v.y,r=(1.4+2*hs(i,j,4))*zf;

function dentFrame(dn){const x0=X[dn.i],y0=Y[dn.i];let m00=0,m01=0,m10=0,m11=0,s00=0,s01=0,s11=0;
  for(const [k,ox,oy] of dn.nb){if(k>=N)continue;const cx=X[k]-x0,cy=Y[k]-y0;m00+=cx*ox;m01+=cx*oy;m10+=cy*ox;m11+=cy*oy;s00+=ox*ox;s01+=ox*oy;s11+=oy*oy}

// 一個柔邊的坑，畫在原點（呼叫前先搬好）：左上暗、右下一彎亮邊
function pitAt(r,a,sh,hi){const g=ctx.createRadialGradient(r*.42,r*.5,r*.3,0,0,r);
    g.addColorStop(0,hexA(sh,0));g.addColorStop(.5,hexA(sh,.3*a));g.addColorStop(.86,hexA(sh,.9*a));g.addColorStop(1,hexA(sh,0));

// v2.26 F7：手指走過的痕跡：一暗一亮兩條柔邊的帶子（寬的淡、窄的深各畫一次），暗的偏左上、亮的偏右下（光從左上來），看起來是一條淺溝；越舊越淡，分五段畫（同一段是一條路徑，疊的地方不會變深）。小坑疊起來會出現一圈一圈的條紋，細線又像畫上去的眉毛，都不用

    for(let b=0;b<5;b++){const k0=b/5,k1=(b+1)/5,kk=(b+.5)/5,path=s0=>{ctx.beginPath();let open=false,any=false;
        for(let j=1;j<TRAIL.length;j++){const q=TRAIL[j],p=TRAIL[j-1],k=1-(t-q.t0)/mat.dentTrail;if(q.n!==p.n||k<k0||k>=k1&&b<4){open=false;continue}any=true;

// 空中不加阻尼、靠真的重力掉；碰到東西才恢復阻尼，所以落地時上半身還帶著速度，會真的壓扁再彈回來（果凍晃多、黏土晃少，照材質）
/* ---------- v2.30 環境互動（多米 11-06：跨出窗外、爬窗邊、打翻擺飾、爬出爬進碗）。窗台拆成前中後三層，各有地板和牆；換層的那一刻身體不跟任何東西重疊，畫面看不出跳了一下 ---------- */
// room 窗台：地板是木頭窗台，撞擺飾、畫面左右；畫在碗和擺飾前面（在碗裡時碗前緣再蓋回來）
// frame 窗框：地板是窗框下緣，撞左右和上窗框；畫在窗框上面、碗和擺飾後面
// out 窗外：地板是窗框後面的台階，只撞地板；畫在牆和窗框後面，鏡頭縮小兩成
// v2.35 拿掉碗（多米 11-08）：mat.bowl 0 時牠住在窗台正中間，碗不畫、不擋、不碰
function noBowl(){return SILL.on&&!(mat.bowl>=.5)}
function sillClampX(x){const S=SILL,g=S.g;if(S.plane==='frame'){const m=R*.72;return Math.max(g.gx+m,Math.min(g.jr-m,x))}

function sillHit(i){const S=SILL,g=S.g,P=S.plane;

// 跳：只留給被嚇到的時候（蹲 0.12 秒再起跳）。平常進出碗用爬的
function sillHop(tx,toBowl){const S=SILL;if(S.hop||S.grab)return;GAIT.on=false;WANDER.moving=false;if(S.route)routeEnd(true);if(noBowl())toBowl=false;let x=toBowl?S.g.bx:sillClampX(tx);if(!toBowl&&S.inBowl&&Math.abs(x-S.g.bx)<S.g.outer+R*.9){toBowl=true;x=S.g.bx}   // v2.31 碗在中間，旁邊放不下整隻：嚇到就原地跳一下再掉回碗裡（量過往旁邊跳會被碗口卡住，只跳 2 點高）

function sillLaunch(){const S=SILL,g=S.g,H0=S.hop,gc=globalC,g0=R*SILLG,hs=1/60/SUB;let y1=-1e9;for(const i of bnd)y1=Math.max(y1,Y[i]);

/* 路線：一串步驟照順序走。sniff 伸偽足、move 重力關掉自己抬到底部在 y（一縮一衝）、plane 換層、drop 重力打開往下掉、walk 貼著某個面走到某個座標、turn 轉到另一個面、surf 直接貼上、wait、fn */
const RT={sniff:(a,L,T)=>({k:'sniff',a,L,T}),move:y=>({k:'move',y}),plane:(p,ib)=>({k:'plane',p,ib}),drop:g=>({k:'drop',g}),walk:(s,to)=>({k:'walk',s,to}),turn:s=>({k:'turn',s}),surf:s=>({k:'surf',s}),wait:T=>({k:'wait',T}),fn:f=>({k:'fn',f})};
function gaitGo(tx,ty,climb){LIFE.st='route';WANDER.sx=HOMEX;WANDER.sy=HOMEY;WANDER.dx=tx;WANDER.dy=ty;WANDER.moving=true;Object.assign(GAIT,{on:true,tx,ty,dash:false,climb:!!climb,ph:-1,prep:0,v:0,h:Math.atan2(ty-HOMEY,tx-HOMEX),k:1,str:1,last:false,off:0})}
function routeStart(steps){const S=SILL;if(!steps)return;if(S.route)routeEnd(true);S.stickT=-1;clingEnd();cutSniffs();GAIT.on=false;WANDER.moving=false;S.route={steps,i:-1,st0:t};LIFE.st='route';routeNext()}
function routeEnd(abort){const S=SILL;if(!S.route)return;S.route=null;GAIT.on=false;GAIT.k=1;WANDER.moving=false;S.lift=false;if(abort){S.tanV=false;S.gtx=0;S.gty=1;S.surf=null}
  if(LIFE.st==='route'||LIFE.st==='go'||LIFE.st==='arrive'){LIFE.st='rest';LIFE.until=t+restDur()}}
function routeNext(){const S=SILL,Q=S.route;if(!Q)return;
  for(;;){Q.i++;Q.st0=t;const q=Q.steps[Q.i];if(!q){routeEnd(false);return}
    if(q.k==='plane'){planeSet(q.p);if(q.ib!=null){S.inBowl=q.ib;if(q.ib)S.want=false}continue}
    if(q.k==='fn'){q.f();if(!S.route)return;continue}
    if(q.k==='surf'){surfSet(q.s);continue}
    if(q.k==='sniff'){startSniff(q.a,q.L,.4,Math.max(.15,q.T-.5),.5);return}
    if(q.k==='move'){S.lift=true;S.tanV=true;S.surf=null;S.gtx=0;S.gty=0;HOMEX=globalC.xc;HOMEY=globalC.yc;const dy=q.y-S.y1;if(Math.abs(dy)<2)continue;gaitGo(HOMEX,HOMEY+Math.sign(dy)*H*2,true);return}   // 目標放很遠：身體底部還在地上時重心先走，一直爬到底部真的到 q.y（routeStep 判定）才停
    if(q.k==='drop'){S.lift=false;S.tanV=false;S.surf=null;S.gtx=0;S.gty=q.g||1;return}
    if(q.k==='walk'){surfSet(q.s);const v=S.tanV,d=q.to-(v?globalC.yc:globalC.xc);if(Math.abs(d)<R*.06)continue;gaitGo(v?HOMEX:q.to,v?q.to:HOMEY,v);return}

/* ---------- 走路（多米 11-06：現實裡做的事跟牠掛勾）。走了一段路，打開時牠從窗外爬回來，身上黏著路上沾到的小東西；捏一下就掉，留在窗框下緣。不改物理，東西只是綁在身體上畫出來。提案 .uiux/04-手感/走路提案-暫定.md ---------- */
// 步數從哪來：網頁拿不到步數，面板按鈕假裝；Swift 版接 CMPedometer，算距離上次帶東西回來走了多少，填進 bank

// 畫：只畫在身體裡。濁：一層白霧（中下方最濃）＋懸著的亮粉慢慢飄；清：亮粉堆在底部（坐在碗裡時堆在碗口看得到的地方），清的那一刻整團發光

function drawFront(sc,env,pl){ctx.setTransform(DPR,0,0,DPR,0,0);if(env){if(pl!=='room'){if(pl==='out')ctx.drawImage(sc.wall,0,0,W,H);drawDeco();drawItems();drawProps()}else drawBowlFront()}drawLoose()}   // 身體之後要蓋回來的：窗外的牆和窗框；窗框層、窗外時的擺飾、走路的東西、碗；碗裡的碗前緣
function sceneFor(kind){sceneLoad();const a=SCENE.img;if(!(a.plate&&a.bowl&&a.succ&&a.peb))return null;const key=kind+'|'+W+'|'+H+'|'+DPR;if(SCENE.cache[key])return SCENE.cache[key];
  const w=Math.round(W*DPR),h=Math.round(H*DPR),sky=document.createElement('canvas');sky.width=w;sky.height=h;const c=sky.getContext('2d');
  const s=Math.min(W/860,H/1130)*DPR,sillTop=h*.72,off=sillTop-1177*s,ox=(w-992*s)/2,gx=ox+156*s,gy=off+304*s,gw=680*s,gh=828*s,night=kind==='night';
  const g=c.createLinearGradient(0,gy,0,gy+gh);g.addColorStop(0,night?'#141B3D':'#9CCBF0');g.addColorStop(1,night?'#2F3A6B':'#DCEEF8');c.fillStyle=g;c.fillRect(gx,gy,gw,gh);
  if(night){c.fillStyle='rgba(255,255,255,.85)';let q=7;const rnd=()=>(q=(q*16807)%2147483647)/2147483647;for(let i=0;i<46;i++){c.beginPath();c.arc(gx+rnd()*gw,gy+rnd()*gh*.8,(.5+rnd()*1.1)*DPR,0,Math.PI*2);c.fill()}c.fillStyle='#F6EFC8';c.beginPath();c.arc(gx+gw*.74,gy+gh*.2,gw*.075,0,Math.PI*2);c.fill();c.fillStyle='#141B3D';c.beginPath();c.arc(gx+gw*.70,gy+gh*.185,gw*.068,0,Math.PI*2);c.fill()}
  else{c.fillStyle='rgba(255,255,255,.92)';for(const [cx,cy,r] of [[.26,.24,1],[.72,.14,.8],[.82,.5,1.15],[.3,.62,.7]]){const u=gw*.1*r,X0=gx+gw*cx,Y0=gy+gh*cy;for(const [dx,dy,rr] of [[-1.1,.2,.62],[-.3,-.25,.9],[.6,-.05,.75],[1.3,.25,.5]]){c.beginPath();c.arc(X0+dx*u,Y0+dy*u,rr*u,0,Math.PI*2);c.fill()}c.fillRect(X0-u*1.6,Y0+u*.1,u*3.3,u*.62)}}
  c.fillStyle=night?'rgba(30,40,80,.9)':'rgba(120,165,150,.45)';c.beginPath();c.moveTo(gx,gy+gh);for(let i=0;i<=40;i++){const q=i/40;c.lineTo(gx+gw*q,gy+gh*(.9-.035*Math.sin(q*9)-.02*Math.sin(q*21)))}c.lineTo(gx+gw,gy+gh);c.fill();
  const room=document.createElement('canvas');room.width=w;room.height=h;const r=room.getContext('2d');r.fillStyle='#F2E7DC';r.fillRect(0,0,w,h);r.clearRect(gx,gy,gw,gh);r.drawImage(a.plate,ox,off,992*s,1586*s);
  if(night){r.globalCompositeOperation='source-atop';r.fillStyle='rgba(38,42,92,.62)';r.fillRect(0,0,w,h);r.globalCompositeOperation='source-over'}
  const base=document.createElement('canvas');base.width=w;base.height=h;const bc=base.getContext('2d');bc.drawImage(sky,0,0);bc.drawImage(room,0,0);return SCENE.cache[key]={base,sky,wall:room}}   // v2.30 拆層：牠在窗外時要畫在天空和牆中間；碗和擺飾每幀畫
let fpsAcc=0,fpsN=0;function viewFps(dt){fpsAcc+=dt;fpsN++;if(fpsAcc>=.5){const el=document.getElementById('v-fps');if(el)el.textContent='· 每幀 '+(fpsAcc/fpsN*1000).toFixed(1)+' ms';fpsAcc=0;fpsN=0}}
function viewSync(){const root=document.getElementById('view');root.classList.toggle('shut',!!VIEW.shut);document.getElementById('v-toggle').textContent=VIEW.shut?'切換':'收起';
  root.querySelectorAll('.seg').forEach(g=>{const k=g.dataset.k;g.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(String(VIEW[k])===b.dataset.v)))});
  try{localStorage.setItem('nienie.view',JSON.stringify(VIEW))}catch(_){}}
function viewSet(o){const need=('body' in o&&o.body!==VIEW.body)||('face' in o&&o.face!==VIEW.face)||('bg' in o&&(o.bg==='blue')!==(VIEW.bg==='blue'));Object.assign(VIEW,o);viewSync();if('shk' in o){mat.shakeMode=VIEW.shk==='eat'?1:0;if(!mat.shakeMode)shkAbsorb();syncSliders()}if(need){SLP.lastAny=t;chooseSlime(SLIME,false,false)}
  if(VIEW.skin!=='flat'&&JEL.fail)hint('這支手機不支援果凍皮，先用平塗')}
document.getElementById('view').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='v-toggle'){VIEW.shut=VIEW.shut?0:1;viewSync();return}const g=b.closest('.seg');if(!g)return;viewSet({[g.dataset.k]:b.dataset.v})});
document.getElementById('view').addEventListener('pointerdown',e=>e.stopPropagation());

function draw(){
  const css=getComputedStyle(document.documentElement),col=n=>css.getPropertyValue(n).trim();
  ctx.clearRect(0,0,W,H);
  // 背景
  const sc=VIEW.bg==='blue'?null:sceneFor(VIEW.bg),env=sc&&SILL.on&&SILL.g,pl=env?SILL.plane:'room';
  if(sc)ctx.drawImage(pl==='out'?sc.sky:sc.base,0,0,W,H);
  else{const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,col('--sky'));g.addColorStop(1,col('--sky2'));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
  if(!FLOAT){ctx.fillStyle=col('--grass');ctx.fillRect(0,GROUND,W,H-GROUND);ctx.fillStyle=col('--grass-line');ctx.fillRect(0,GROUND,W,3)}
  if(FLOAT&&mat.specks>=.5&&!sc)drawSpecks(col);
  if(env&&pl==='room'){drawDeco();drawItems()}   // 窗台層：擺飾、走路帶回來的東西都在牠後面（v2.31 東西放窗台上碗的左右，擺飾前面）
  if(env&&pl==='room')drawProps();
  // 鏡頭：之後畫的都在世界座標；描邊粗細除以 z，畫面上看起來一樣粗
  {const v=viewV();ctx.setTransform(DPR*CAM.z,0,0,DPR*CAM.z,DPR*(v.x-CAM.z*CAM.x),DPR*(v.y-CAM.z*CAM.y))}
  if(IV.s!==1||IV.ox||IV.oy){ctx.translate(INTRO.px+IV.ox,INTRO.py+IV.oy);ctx.scale(IV.s,IV.s);ctx.translate(-INTRO.px,-INTRO.py)}   // v2.17 開場的遠近
  const P=boundaryPts();
  let minX=1e9,maxX=-1e9,maxY=-1e9,cx=globalC.xc,cy=globalC.yc;
  for(const p of P){minX=Math.min(minX,p[0]);maxX=Math.max(maxX,p[0]);maxY=Math.max(maxY,p[1])}
  // 影子
  const sw=(maxX-minX)*.5,sy=FLOAT?Math.max(maxY,CY+R*1.2)+R*.35:GROUND+10;
  const lift=FLOAT?Math.max(0,Math.min(1,(sy-maxY)/(R*1.2))):0;
  const pz=mat.press2>=.5?Math.max(0,PRESS_SUM):0;   // v2.16 P6：按住時身體被往下壓一點，影子寬一點、深一點
  if(mat.life2<.5||mat.shadow>=.5||!FLOAT){   // v2.19 A8：懸空時不畫影子（上下左右走，影子讓空間前後矛盾）；地面對照照畫
  ctx.fillStyle=`rgba(60,90,40,${(FLOAT?.10+.08*(1-lift):.16)+.04*pz})`;
  ctx.beginPath();ctx.ellipse((minX+maxX)/2,sy,sw*(FLOAT?.7+.3*(1-lift):1.05)*(1+.08*pz),   // 影子跟整體寬度置中（拉長時跟重心會偏一邊）
    R*.11*(FLOAT?.8:1),0,0,Math.PI*2);ctx.fill()}
  if(VIEW.skin!=='flat'&&jelReady()){jelRender(P,ctx.getTransform(),col);ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(JEL.c,0,0);ctx.restore();drawGlitter(P);drawBlush(P);drawEyes(col);drawStuck();drawFront(sc,env,pl);return}   // v2.28 預覽：果凍皮畫身體
  ctx.save();
  if(!FLOAT){ctx.beginPath();ctx.rect(0,0,W,GROUND+2);ctx.clip()}
  // 身體：陰影色打底，再用往左上偏移的底色蓋住
  bodyPath(P);ctx.fillStyle=tint(col('--shade'),true);ctx.fill();   // v2.22 E3：顏色跟印象偏一點
  ctx.save();bodyPath(P);ctx.clip();bodyPath(P,-R*.07,-R*.085);ctx.fillStyle=tint(col('--body'));ctx.fill();
  // 凹痕：陰影色的橢圓，再用底色往右下偏蓋掉，留左上一彎陰影（光從左上來，凹下去的地方左上那面背光）
  if(mat.press2>=.5){drawTrail(col);drawDents(col)}
  else for(const dn of DENTS){const r=R*mat.dentSize*dn.d;if(r<.5)continue;const x=X[dn.i],y=Y[dn.i];
    ctx.fillStyle=col('--shade');ctx.beginPath();ctx.ellipse(x,y,r,r*.8,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=col('--body');ctx.beginPath();ctx.ellipse(x+r*.22,y+r*.26,r*.82,r*.64,0,0,Math.PI*2);ctx.fill()}
  // 亮光：綁在左上粒子，跟著整體旋轉
  let hx=X[hiIdx],hy=Y[hiIdx];const ang=Math.atan2(globalC.sn,globalC.cs);
  // v2.16 P5：手指按在亮光附近（0.45R 內），亮光往遠離手指的方向被擠開、沿那個方向壓扁
  let sq=0,ux=1,uy=0;if(mat.press2>=.5){let ox=0,oy=0;
    for(const dn of DENTS){if(dn.p<=0)continue;const dx=hx-X[dn.i],dy=hy-Y[dn.i],d=Math.hypot(dx,dy),rad=R*.45;if(d>=rad)continue;
      const a=(1-d/rad)*Math.min(1,dn.p),vx=d>1e-6?dx/d:1,vy=d>1e-6?dy/d:0;ox+=vx*a*R*.16;oy+=vy*a*R*.16;if(a>sq){sq=a;ux=vx;uy=vy}}
    hx+=ox;hy+=oy}
  ctx.fillStyle=col('--hi');ctx.save();ctx.translate(hx,hy);
  // v2.26 F7：亮光跟著局部拉伸（周圍粒子擬合，去掉轉動，太誇張就往單位矩陣收）
  if(mat.hiStretch>=.5&&hiIdx<N&&HIF.i===hiIdx){let [ma,mb,mc,md]=dentFrame(HIF);const h0=(ma+md)/2,h1=Math.hypot((ma-md)/2,(mb+mc)/2),lb=h0+h1,ls=h0-h1;let q=1;if(lb>1.8)q=Math.min(q,.8/(lb-1));if(ls<.55)q=Math.min(q,.45/(1-ls));ctx.transform(1+q*(ma-1),q*mb,q*mc,1+q*(md-1),0,0)}
  if(sq>0){const s=1-.4*sq,k=s-1,s2=1+.25*sq,k2=s2-1;   // 沿 u 壓成 s 倍、垂直方向撐開 s2 倍
    ctx.transform(1+k*ux*ux+k2*uy*uy,(k-k2)*ux*uy,(k-k2)*ux*uy,1+k*uy*uy+k2*ux*ux,0,0)}
  ctx.beginPath();ctx.ellipse(0,0,R*.17,R*.085,ang-.5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(Math.cos(ang-.2)*R*.26,Math.sin(ang-.2)*R*.26,R*.035,0,Math.PI*2);ctx.fill();ctx.restore();
  drawGlitter(P);drawEyes(col);   // v2.23 眼睛畫在身體裡、描邊之前；v2.31 亮粉在眼睛底下
  ctx.restore();
  // 描邊
  if(mat.inkVar>0){ctx.fillStyle=col('--line');inkBand(P,Math.max(4,R*.034)/CAM.z);ctx.fill()}   // 候選 34：描邊粗細隨壓縮
  else{bodyPath(P);ctx.lineWidth=Math.max(4,R*.034)/CAM.z;ctx.lineJoin='round';ctx.strokeStyle=col('--line');ctx.stroke()}
  ctx.restore();
  drawStuck();
  drawFront(sc,env,pl);
}

/* ---------- 主迴圈 ---------- */
function frame(now){
  const dt=Math.min(1/30,Math.max(1/240,(now-last)/1000||1/60));last=now;
  update(dt);draw();viewFps(dt);impSave(false);requestAnimationFrame(frame);
}

/* ---------- UI ---------- */
// v2.23 收集：底部換成四隻史萊姆；材質改到面板（對照用，顏色、外形、個性照現在這隻）
function applySlimeColors(s){const st=document.documentElement.style;['--body','--shade','--line','--hi','--eye'].forEach((k,i)=>st.setProperty(k,s.c[i]))}
let hintT=null;function hint(s){const h=$('hint');h.textContent=s;h.classList.remove('off');clearTimeout(hintT);hintT=setTimeout(()=>h.classList.add('off'),2600)}
function chooseSlime(i,intro,say){if(mat.imp>=.5)IMPS[SLIMES[SLIME].id]={tr:IMP.tr,w:IMP.w};
  const s=SLIMES[i];SLIME=i;try{localStorage.setItem('nienie.slime',s.id)}catch(_){}
  mat={...PRESETS[s.mat],seed:s.seed,...s.p,...viewOver()};curMat=s.mat;applySlimeColors(s);
  for(let k=0;k<SLIMES.length;k++)$('s-'+k).setAttribute('aria-pressed',String(k===i));
  setup();impReset();const o=IMPS[s.id];if(o){IMP.tr=o.tr;IMP.w=o.w}IMPD.tr=IMP.tr;IMPD.w=IMP.w;
  syncSliders();if(intro)startIntro();if(say)hint(s.name+'：'+s.desc)}
SLIMES.forEach((s,k)=>{const b=document.createElement('button');b.id='s-'+k;b.setAttribute('aria-pressed','false');b.innerHTML=`<i style="background:${s.c[0]}"></i>${s.name}`;
  b.addEventListener('click',()=>{if(k!==SLIME)chooseSlime(k,true,true)});$('slimes').appendChild(b)});
function setMat(name){const s=SLIMES[SLIME];mat={...PRESETS[name],seed:s.seed,...s.p,...viewOver()};curMat=name;syncSliders()}
for(const k of ['jelly','mochi','clay'])$('tm-'+k).addEventListener('click',()=>setMat(k));
$('b-reset').addEventListener('click',()=>{relax()});   // 揉回原形：用動畫不瞬移（換種子才走 setup）
$('b-float').addEventListener('click',()=>{FLOAT=!FLOAT;$('b-float').setAttribute('aria-pressed',String(FLOAT));$('b-float').textContent=FLOAT?'懸空（多米定案）':'地面（對照用）';setup();dump()});
// 隱藏面板：長按標題 1.2 秒
let pressT=null;
$('brand').addEventListener('pointerdown',()=>{pressT=setTimeout(()=>{$('tune').classList.toggle('hidden')},1200)});
for(const ev of ['pointerup','pointerleave','pointercancel'])$('brand').addEventListener(ev,()=>clearTimeout(pressT));
$('t-close').addEventListener('click',()=>$('tune').classList.add('hidden'));
$('t-walk-s').addEventListener('click',()=>{$('tune').classList.add('hidden');walkFake(800)});$('t-walk-b').addEventListener('click',()=>{$('tune').classList.add('hidden');walkFake(3500)});$('t-walk-0').addEventListener('click',()=>{walkClear()});
$('t-shake-1').addEventListener('click',()=>{$('tune').classList.add('hidden');shkShake(0,0)});$('t-shake-3').addEventListener('click',()=>{$('tune').classList.add('hidden');for(let k=0;k<3;k++)setTimeout(()=>shkShake(k%2?1:-1,-.5),k*220)});$('t-shake-0').addEventListener('click',()=>{shkAbsorb();for(const q of SNW.glit)q.h=0;shkMeasure()});
$('walk-yes').addEventListener('click',()=>walkAnswer(true));$('walk-no').addEventListener('click',()=>walkAnswer(false));
$('t-intro').addEventListener('click',()=>{$('tune').classList.add('hidden');for(const f of [...fingers.values()])releaseFinger(f,true);setup();startIntro()});
$('t-copy').addEventListener('click',()=>{const s=$('t-out').value;navigator.clipboard&&navigator.clipboard.writeText(s)});
// 第二批候選（網頁版只有這三條；觸覺類在 Swift 版）。一次只套一條，先記下對照值再比
$('cands').addEventListener('click',e=>{const c=e.target.getAttribute('data-c');if(!c)return;
  if(c==='226')Object.assign(mat,OFF27);else if(c==='223')Object.assign(mat,OFF24);else if(c==='224')Object.assign(mat,OFF25);else if(c==='225')Object.assign(mat,OFF26);else if(c==='6')mat.lag=.03;else if(c==='19')mat.idleFreeze=1;else if(c==='2')mat.specialEvery=8;else if(c==='41'){mat.tentRung=0;mat.tentAxis=0}else if(c==='21')mat.homeK=.003;else if(c==='22')mat.afterglow=.25;else if(c==='23'){mat.breathT=6;mat.breathShape=1;mat.breathDeep=1}else if(c==='25')mat.slip=1;else if(c==='26')mat.stick=.1;else if(c==='27')mat.localArea=1;else if(c==='33')mat.homeFrac=.46;else if(c==='34')mat.inkVar=1;else if(c==='27v')Object.assign(mat,V27[curMat]||{});else if(c==='212')Object.assign(mat,V212[curMat]||{});else if(c==='219')Object.assign(mat,{slide:0,drag:0,dentFade:10,imp:0,e1:0,e2:0,e3:0,e4:0,eyes:0,sleep:0,echo:0,introSwim:0});else if(c==='220')mat.slide=0;else if(c==='221')Object.assign(mat,{e1:0,e2:0,e3:0,e4:0,eyes:0,sleep:0,echo:0,introSwim:0});else if(c==='222')Object.assign(mat,{eyes:0,sleep:0,echo:0,introSwim:0})
  syncSliders()});
const sl={};
(function buildSliders(){const host=$('sliders');
  for(const [key,name,hint,min,max,step] of F){
    const lab=document.createElement('label');
    lab.innerHTML=`<span>${name}</span><output></output><small>${hint}</small><input type="range" min="${min}" max="${max}" step="${step}">`;
    const inp=lab.querySelector('input'),out=lab.querySelector('output');
    inp.addEventListener('input',()=>{mat[key]=parseFloat(inp.value);out.textContent=inp.value;if(key==='one')oneSync();dump()});
    host.appendChild(lab);sl[key]={inp,out};
  }})();
function oneSync(){const e=$('slimes');if(e)e.style.display=mat.one>=.5?'none':''}   // v2.33 一隻為主：底部四隻不顯示
function syncSliders(){for(const k in sl){sl[k].inp.value=mat[k];sl[k].out.textContent=String(mat[k])}oneSync();dump()}
function dump(){$('t-out').value=JSON.stringify({...mat,float:FLOAT})}

viewSync();sceneLoad();hintT=setTimeout(()=>$('hint').classList.add('off'),5000);
addEventListener('resize',()=>{setup()});
walkLoad();walkOpen();
if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission!=='function')shkMotionInit();   // v2.31 不用問權限的平台直接接；iOS 等第一次觸碰再問
{let i=PRESETS.clay.one>=.5?2:0;try{const k=SLIMES.findIndex(s=>s.id===localStorage.getItem('nienie.slime'));if(k>=0&&PRESETS.clay.one<.5)i=k}catch(_){}chooseSlime(i,true,false)}   // v2.23：上次選的那隻；v2.33 一隻為主時永遠是芋圓
requestAnimationFrame(frame);
