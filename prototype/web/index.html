<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>捏捏史萊姆｜形狀匹配原型 v2.5</title>
<style>
:root{
  --sky:#CDEBFA; --sky2:#E6F5FD; --grass:#C5E8A8; --grass-line:#A9D68A;
  --body:#FFD96B; --shade:#F0B64A; --line:#8B5A20; --hi:#FFF6D6;
  --ink:#2E3A2A; --ink-soft:#5E7458; --chip:#FFFFFF; --chip-line:#2E3A2A; --chip-on:#2E3A2A; --chip-on-ink:#FFFFFF;
  --ui:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;
}
*{-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--sky);color:var(--ink);font-family:var(--ui);touch-action:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.bar{position:fixed;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.bar>*{pointer-events:auto}
.top{top:0;padding-top:calc(env(safe-area-inset-top,0px) + 14px)}
.bottom{bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}
.brand{font-weight:800;font-size:22px;letter-spacing:.04em;display:flex;align-items:baseline;gap:8px;padding:6px 2px}
.brand span{font-size:12px;font-weight:700;color:var(--ink-soft);letter-spacing:.14em}
.round{width:46px;height:46px;border-radius:50%;border:2.5px solid var(--chip-line);background:var(--chip);display:grid;place-items:center;flex:none;padding:0;box-shadow:0 3px 0 var(--chip-line);font-size:18px}
.round[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.mats{display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--chip);border:2.5px solid var(--chip-line);box-shadow:0 3px 0 var(--chip-line);min-width:0}
.mats button{border:0;background:transparent;border-radius:999px;padding:8px 11px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:5px;white-space:nowrap;color:var(--ink)}
.mats button i{width:10px;height:10px;border-radius:50%;display:inline-block}
.mats button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.hint{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 74px);
  padding:8px 16px;border-radius:999px;background:#fff;border:2.5px solid var(--chip-line);font-size:14px;font-weight:700;
  box-shadow:0 3px 0 var(--chip-line);transition:opacity .6s;pointer-events:none}
.hint.off{opacity:0}
.tune{max-height:calc(100vh - 210px);overflow:auto;position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  bottom:calc(env(safe-area-inset-bottom,0px) + 92px);background:#fff;border:2.5px solid var(--chip-line);border-radius:22px;box-shadow:0 4px 0 var(--chip-line);
  padding:14px 16px 12px;display:grid;gap:10px;z-index:5}
.tune.hidden{display:none}
.tune-head{display:flex;justify-content:space-between;align-items:baseline}
.tune-head b{font-size:17px}.tune-head span{font-size:12px;font-weight:700;color:var(--ink-soft)}
.tune label{display:grid;grid-template-columns:1fr auto;grid-template-areas:"name val" "hint hint" "range range";column-gap:8px;font-size:14px;font-weight:700}
.tune small{grid-area:hint;font-size:11.5px;font-weight:500;color:var(--ink-soft)}
.tune input[type=range]{grid-area:range;width:100%;accent-color:#2E3A2A;margin:2px 0 0}
.tune output{grid-area:val;font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink-soft)}
.tune-actions{display:flex;gap:8px}
.tune-actions button{flex:1;border:2.5px solid var(--chip-line);border-radius:999px;background:#fff;padding:8px;font-size:14px;font-weight:700;color:var(--ink)}
.tune-actions button:first-child{background:var(--chip-on);color:var(--chip-on-ink)}
.tune textarea{width:100%;box-sizing:border-box;font:12px ui-monospace,Menlo,monospace;border:1.5px solid #c9d3c4;border-radius:10px;padding:6px 8px;resize:none;color:var(--ink)}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="bar top">
  <div class="brand" id="brand">捏捏<span>SHAPE MATCH v2.5</span></div>
  <button class="round" id="b-mute" aria-pressed="false" title="聲音">🔈</button>
</div>

<div class="hint" id="hint">捏它、拉它、甩它的觸手。放著不管它也會飄</div>

<div class="bar bottom">
  <div class="mats" role="group" aria-label="手感">
    <button id="m-jelly" aria-pressed="false"><i style="background:#7FE0C2"></i>果凍</button>
    <button id="m-mochi" aria-pressed="false"><i style="background:#C9B6FF"></i>麻糬</button>
    <button id="m-clay" aria-pressed="true"><i style="background:#FFD86B"></i>黏土</button>
  </div>
  <button class="round" id="b-reset" title="回原形">↺</button>
</div>

<div class="tune hidden" id="tune">
  <div class="tune-head"><b>調整面板</b><span>長按「捏捏」開關</span></div>
  <div id="sliders"></div>
  <div class="tune-actions" id="cands"><button data-c="6">候選 6 黏滯 0.03</button><button data-c="19">候選 19 凍住</button><button data-c="2">候選 2 特別回彈</button><button data-c="41">41 對照：關橫檔</button></div>
  <div class="tune-actions"><button id="b-float" aria-pressed="true">懸空（多米定案）</button><button id="t-copy">複製數值</button><button id="t-close">收起</button></div>
  <textarea id="t-out" readonly rows="3" aria-label="目前的手感數值"></textarea>
</div>

<script>
'use strict';
/* =========================================================
   捏捏史萊姆 v2：形狀匹配軟體（Müller 2005）＋塑性＋活物感
   - 身體 = 一群粒子；每幀每個區塊算出「最接近的剛體／線性擺放」，粒子被拉回去
   - 永遠拉得回來、不爆、不打結（輪廓由邊界粒子依原始順序連成）
   - 塑性：變形超過 yield 就慢慢改參考形狀（留形）；沒碰時參考形狀回原樣
   - 活物：沒碰時呼吸、慢搖、偶爾抖、懸空時上下浮
   - v2.3（手感精修提案第一批，2026-11-01）：按下去那塊往四周攤開（接觸點先凹，側視圖用壓扁表現）；
     放手強度看「拉多遠」與「甩多快」取大；抓住 0.2 秒內純彈性、0.6 秒後才全速記形（輕按回彈，揉捏即留形）；
     揉回原形用動畫不瞬移；系統收走觸控時安靜放開
   - v2.4（第二批候選，2026-11-01）：idleFreeze（碰到時活物感凍住不歸零）、specialEvery（偶發特別回彈）兩個開關，
     預設關（對照值）；面板「候選」按鈕一次套一條。觸覺類候選（12、13、14、9、38）只在 Swift 版
   - v2.5（提案第 41 條，2026-11-01）：觸手橫檔（tentRung）＋中軸不折返（tentAxis），抓觸手根部往尖端推不再對折；
     兩個都預設開，面板「41 對照：關橫檔」關掉當對照。量法在 selftest.js 的 T11（固定情境網格）
   - 音效：真實錄音切片。讀 sfx/manifest.json，分四類（press 按、pull 拉、release 放手、rub 持續揉），
     每類多段隨機挑、音高 ±8%、音量跟動作強度。沒有檔案就安靜。錄法見 .uiux/04-手感/錄音指南.md
   ========================================================= */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;

const PRESETS={
  jelly:{alpha:.34,beta:0,damp:.986,yield:1.5,creep:0,  recover:1,   grabR:.36,maxPull:1.6,lag:.05,wGlobal:.12,cSpace:.3,cRad:.42,upright:.004,anchor:4,areaGain:.6,gripRot:3,life:1, seed:7,floppy:.5,drift:.16,wriggle:.07,wander:.25,pressBase:.12,pressHold:.18,pressHoldTime:.6,pressRise:.06,pressFirst:.5,dwellLo:.2,dwellHi:.6,idleFreeze:0,specialEvery:0,tentRung:.5,tentAxis:.85},
  mochi:{alpha:.28,beta:0,damp:.966,yield:.14,creep:.9, recover:.18, grabR:.32,maxPull:1.8,lag:.08,wGlobal:.10,cSpace:.3,cRad:.45,upright:.004,anchor:4,areaGain:.6,gripRot:3,life:1, seed:7,floppy:.55,drift:.16,wriggle:.07,wander:.25,pressBase:.12,pressHold:.18,pressHoldTime:.6,pressRise:.06,pressFirst:.5,dwellLo:.2,dwellHi:.6,idleFreeze:0,specialEvery:0,tentRung:.5,tentAxis:.85},
  clay: {alpha:.40,beta:0,damp:.940,yield:.05,creep:3,  recover:.03, grabR:.32,maxPull:2.0,lag:.12,wGlobal:.08,cSpace:.3,cRad:.45,upright:.002,anchor:4,areaGain:.5,gripRot:3,life:.8,seed:7,floppy:.6,drift:.14,wriggle:.06,wander:.22,pressBase:.12,pressHold:.18,pressHoldTime:.6,pressRise:.06,pressFirst:.5,dwellLo:.2,dwellHi:.6,idleFreeze:0,specialEvery:0,tentRung:.5,tentAxis:.85},
};
const F=[
  ['alpha','回彈硬度','越大越快回去、越硬',.05,.8,.01],
  ['beta','線性柔軟','越大越能壓扁拉長（面積守恆）',0,1,.01],
  ['damp','晃動阻尼','越小放手晃越久',.85,.999,.001],
  ['yield','定型門檻（×半徑）','變形超過這個才開始留形',.02,1.5,.01],
  ['creep','定型速度','揉多快記住新形狀',0,6,.1],
  ['recover','回原形速度','放著多快變回原樣',0,1.5,.01],
  ['grabR','抓取範圍（×半徑）','一指抓到多大一塊',.2,.8,.01],
  ['maxPull','拉伸上限（×半徑）','最多拉多遠',.6,2.6,.05],
  ['lag','黏滯','跟手的延遲感（秒）',0,.3,.01],
  ['pressBase','按壓攤開（×半徑）','按下去那塊往四周攤多少（看得到的約一半）',0,.3,.01],
  ['pressHold','按住再攤（×半徑）','按住不動時再多攤多少',0,.3,.01],
  ['pressHoldTime','按壓下沉時間','按住多久攤到最深（秒）',.1,2,.05],
  ['pressRise','按壓時間常數','攤開多快到位（秒）',.01,.3,.01],
  ['pressFirst','按壓第一幀比例','按下那一幀先到目標的幾成',0,1,.05],
  ['dwellLo','定型停留起點','抓住幾秒後開始記形（秒）',0,1,.05],
  ['dwellHi','定型停留終點','抓住幾秒後全速記形（秒）',0,2,.05],
  ['idleFreeze','碰到時凍住','1：活物感時鐘停住不歸零（候選 19）',0,1,1],
  ['specialEvery','特別回彈','每幾次放手來一次特別 Q 的回彈，0 關（候選 2 是 8）',0,12,1],
  ['tentRung','觸手橫檔','兩邊成對的粒子不能翻到對面、寬度不低於靜止的幾成；0 關＝v2.4 以前（第 41 條）',0,.9,.05],
  ['tentAxis','觸手中軸不折返','中軸每一節在上一節方向上至少前進靜止節距的幾成；0 關＝v2.4 以前（第 41 條）',0,1,.05],
  ['wGlobal','整體性','越大整團越像一塊',0,1,.01],
  ['cSpace','區塊間距（×半徑）','越小區塊越多越軟',.15,.7,.05],
  ['cRad','區塊半徑（×半徑）','越小越軟、越容易拉出一塊',.25,1,.01],
  ['upright','回正','放手後轉回頭朝上的速度',0,.02,.001],
  ['anchor','抓著時的定身','越大身體越不會整團跟著手走、轉掉',1,8,.5],
  ['areaGain','面積壓力','壓扁時旁邊鼓出來的程度',0,1.5,.05],
  ['gripRot','抓著時不轉','越大拉它時身體越不會歪掉',1,8,.5],
  ['life','活物感','沒碰時自己動的幅度',0,1.5,.05],
  ['drift','觸手飄動','沒碰時觸手擺動的幅度（×半徑）',0,.4,.01],
  ['wriggle','蠕動','沒碰時整個身體輪廓慢慢變形的幅度（×半徑）',0,.2,.01],
  ['wander','遊走','沒碰時在畫面裡移動的速度（×半徑／秒）',0,1,.05],
  ['floppy','觸手軟度','越大觸手末端越軟、越會甩',0,.9,.05],
  ['seed','外形亂數種子','換一個數字就換一個形狀（會重置）',1,30,1],
];
let mat={...PRESETS.clay};  // 多米 2026-10-31 選黏土
let FLOAT=true;

/* ---------- 世界 ---------- */
let W,H,DPR,R,CX,CY,GROUND,HOMEX,HOMEY,h;
let N=0,X,Y,PX,PY,Q0X,Q0Y,QX,QY,GX,GY,GW,RX,RY,GRAB,TID,TU,TUB,KF,EX,EY;
let bnd=[];          // 邊界粒子索引，依角度順序
let bndL=[];         // 相鄰邊界粒子的靜止距離
let BIDX;            // 每顆粒子在邊界環上的序號，-1 = 內部
let clusters=[];     // {idx,w,cs,sn,xc,yc,qcx,qcy}
let globalC=null;
let hiIdx=0;         // 亮光跟著哪顆粒子
let lastC={cSpace:0,cRad:0};
let lastShape={seed:7,floppy:0};
let t=0,last=0,lastTouch=-10,nextTwitch=3,A0=1,relaxUntil=-1;
let tLife=0,releaseCount=0,nextSpecial=0,specialUntil=-1;   // 候選 19 的活物感時鐘；候選 2 的特別回彈計數
const WANDER={dx:0,dy:0,next:3,moving:false};

/* ---------- 外形：癱軟的不規則團塊＋觸手（多米 10-31：要觸手、不要完整形體） ---------- */
let TENT=[],PH=[];   // 觸手定義、團塊的亂數相位
let RUNGS=[],RS=[],RUNGREF=[];  // 每條觸手的橫檔（兩邊成對的邊界粒子）、靜止時的左右手性、根部參考點（第 41 條候選 h）
function rng(seed){let x=seed*9301+49297;return()=>{x=(x*9301+49297)%233280;return x/233280}}
function defineShape(){
  const r=rng(Math.round(mat.seed)*7+3);
  PH=[r()*6.28,r()*6.28,r()*6.28,(-72+(r()-.5)*30)*Math.PI/180];   // PH[3]：頭頂鼓包的角度
  // 角度：螢幕座標 y 向下，90° 是正下方。大多垂在下方與兩側，頂上一個短凸起當頭的方向感
  // 頂上的「頭」不用細觸手（尖端比粒子間距細會自交），改成團塊的鼓包（見 blobR）
  const base=[[100,2.1,.17],[55,1.8,.15],[140,1.65,.14],[8,1.5,.14],[198,1.35,.13]];
  TENT=base.map(([deg,L,w])=>{const a=(deg+(r()-.5)*22)*Math.PI/180;
    // curl：靜止時就彎（正負隨機）；droop：越橫、越朝上的觸手越往下垂
    const curl=(r()-.5)*.6,droop=.15+.3*Math.max(0,-Math.sin(a));
    return{a,ux:Math.cos(a),uy:Math.sin(a),L:L*(.85+r()*.3),w:w*(.85+r()*.3),curl,droop,uExit:0}});
  for(const t of TENT){const b=blobR(t.a);t.uExit=Math.min(.8,Math.max(0,(b*.95-b*.35)/(t.L-b*.35)))}
}
function blobR(a){let d=a-PH[3];d=Math.atan2(Math.sin(d),Math.cos(d));
  return .78+.10*Math.sin(2*a+PH[0])+.07*Math.sin(3*a+PH[1])+.04*Math.sin(5*a+PH[2])+.24*Math.exp(-((d/.38)**2))}   // ×R，最後一項是頭頂鼓包
// 哪一條觸手、沿觸手的位置 u（0 根 1 尖）、到軸線距離
function tentHit(x,y){let best=null;
  for(let k=0;k<TENT.length;k++){const t=TENT[k],r0=blobR(t.a)*R*.35,sx=t.ux*r0,sy=t.uy*r0,ex=t.ux*t.L*R,ey=t.uy*t.L*R;
    const dx=ex-sx,dy=ey-sy,len2=dx*dx+dy*dy;let u=((x-sx)*dx+(y-sy)*dy)/len2;u=Math.max(0,Math.min(1,u));
    const px=sx+dx*u,py=sy+dy*u,d=Math.hypot(x-px,y-py),w=t.w*R*(1-.12*u);
    if(d<w&&(!best||d/w<best.q))best={k,u,q:d/w}}
  return best}
function inside(x,y){const a=Math.atan2(y,x);if(Math.hypot(x,y)<blobR(a)*R)return true;return tentHit(x,y)!==null}
function restR(a){const c=Math.cos(a),s=Math.sin(a),step=R/150;let last=0;
  for(let t=0;t<=R*2.6;t+=step)if(inside(c*t,s*t))last=t;return last}

function setup(){
  DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
  R=Math.max(60,Math.min(W*.26,H*.14,160));GROUND=Math.min(H*.64,H-140);CX=W/2;
  defineShape();
  // 邊界：先用細角度掃出多邊形，再依弧長等距重取樣（觸手很細，用角度等距會取不到點）
  const FINE=1440,poly=[];for(let i=0;i<FINE;i++){const a=-Math.PI/2+i/FINE*Math.PI*2,r=restR(a);poly.push([Math.cos(a)*r,Math.sin(a)*r])}
  let maxY=-1e9;for(const q of poly)maxY=Math.max(maxY,q[1]);
  CY=FLOAT?H*.40:GROUND-maxY;HOMEX=CX;HOMEY=CY;
  h=R/9;
  const cum=[0];for(let i=1;i<=FINE;i++){const a=poly[i-1],b=poly[i%FINE];cum.push(cum[i-1]+Math.hypot(b[0]-a[0],b[1]-a[1]))}
  const per=cum[FINE],M=Math.max(60,Math.round(per/(h*1.05)));
  const pts=[];bnd=[];
  for(let m=0,j=0;m<M;m++){const target=m/M*per;while(cum[j+1]<target)j++;const f=(target-cum[j])/(cum[j+1]-cum[j]||1);
    const a=poly[j],b=poly[(j+1)%FINE];bnd.push(pts.length);pts.push([a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f])}
  let row=0;
  for(let gy=-2.7*R;gy<=2.7*R;gy+=h*.87,row++){
    for(let gx=-2.7*R+(row%2?h/2:0);gx<=2.7*R;gx+=h){
      if(!inside(gx,gy))continue;
      let dmin=1e9;for(let b=0;b<M;b++){const d=Math.hypot(pts[b][0]-gx,pts[b][1]-gy);if(d<dmin)dmin=d}
      if(dmin>h*.7)pts.push([gx,gy]);
    }
  }
  N=pts.length;
  X=new Float64Array(N);Y=new Float64Array(N);PX=new Float64Array(N);PY=new Float64Array(N);
  Q0X=new Float64Array(N);Q0Y=new Float64Array(N);QX=new Float64Array(N);QY=new Float64Array(N);
  GX=new Float64Array(N);GY=new Float64Array(N);GW=new Float64Array(N);RX=new Float64Array(N);RY=new Float64Array(N);
  GRAB=new Uint8Array(N);TID=new Int8Array(N);TU=new Float64Array(N);TUB=new Float64Array(N);KF=new Float64Array(N);EX=new Float64Array(N);EY=new Float64Array(N);
  for(let i=0;i<N;i++){Q0X[i]=QX[i]=pts[i][0];Q0Y[i]=QY[i]=pts[i][1];X[i]=PX[i]=CX+pts[i][0];Y[i]=PY[i]=CY+pts[i][1];
    const ht=tentHit(pts[i][0],pts[i][1]);const inBlob=Math.hypot(pts[i][0],pts[i][1])<blobR(Math.atan2(pts[i][1],pts[i][0]))*R*.9;
    if(ht&&!inBlob){TID[i]=ht.k;TU[i]=ht.u;const ue=TENT[ht.k].uExit;TUB[i]=Math.max(0,(ht.u-ue)/(1-ue));KF[i]=1-mat.floppy*ht.u}else{TID[i]=-1;TU[i]=0;TUB[i]=0;KF[i]=1}}
  // 靜止姿態：觸手彎＋垂。對參考形狀做平滑形變，邊界與內部一起動，所以邊界順序仍然成立
  for(let i=0;i<N;i++){const k=TID[i];if(k<0)continue;const tt=TENT[k],u=TUB[i],u2=u*u;
    const bx=-tt.uy*tt.curl*u2*R*.45,by=tt.ux*tt.curl*u2*R*.45+tt.droop*u2*R;
    Q0X[i]+=bx;Q0Y[i]+=by;QX[i]=Q0X[i];QY[i]=Q0Y[i];X[i]=PX[i]=CX+Q0X[i];Y[i]=PY[i]=CY+Q0Y[i]}
  // Q0 置中成零均值（跟 plasticity 每幀的置中同一個基準；否則觸手記憶淡化會把觸手拉向另一個基準，交界被一點一點拉開）
  {let mx=0,my=0;for(let i=0;i<N;i++){mx+=Q0X[i];my+=Q0Y[i]}mx/=N;my/=N;
    for(let i=0;i<N;i++){Q0X[i]-=mx;Q0Y[i]-=my;QX[i]=Q0X[i];QY[i]=Q0Y[i];X[i]=PX[i]=CX+Q0X[i];Y[i]=PY[i]=CY+Q0Y[i]}}
  buildClusters();
  bndL=bnd.map((i,k)=>{const j=bnd[(k+1)%bnd.length];return Math.hypot(Q0X[j]-Q0X[i],Q0Y[j]-Q0Y[i])});
  BIDX=new Int32Array(N).fill(-1);bnd.forEach((i,k)=>{BIDX[i]=k});
  buildRungs();
  // 亮光粒子：團塊左上
  let bd=1e9;for(let i=0;i<N;i++){if(TID[i]>=0)continue;const d=Math.hypot(Q0X[i]+R*.28,Q0Y[i]+R*.32);if(d<bd){bd=d;hiIdx=i}}
  fingers.clear();GRAB.fill(0);lastShape={seed:mat.seed,floppy:mat.floppy};
  {let A=0;const n=bnd.length;for(let i=0;i<n;i++){const a=bnd[i],b=bnd[(i+1)%n];A+=X[a]*Y[b]-X[b]*Y[a]}A0=Math.abs(A)/2}
}

function buildRungs(){
  // 觸手橫檔：一條觸手的邊界在環上是連續的一段，先沿一邊到尖端、再沿另一邊回來。
  // 把兩邊「沿觸手位置 u 最接近」的粒子配成一對（橫檔），記靜止寬度與左右手性（局部切線 × 橫檔向量的正負）。
  RUNGS=[];RS=[];RUNGREF=[];const nb=bnd.length;
  for(let k=0;k<TENT.length;k++){
    const pos=[];for(let r=0;r<nb;r++)if(TID[bnd[r]]===k)pos.push(r);
    if(pos.length<4){RUNGS.push([]);RS.push(1);RUNGREF.push([bnd[0],bnd[0]]);continue}
    const inRun=new Set(pos);let start=pos[0];for(const r of pos){if(!inRun.has((r+nb-1)%nb)){start=r;break}}
    const run=[];for(let m=0;m<pos.length;m++)run.push(bnd[(start+m)%nb]);
    let tipAt=0;for(let m=1;m<run.length;m++)if(TU[run[m]]>TU[run[tipAt]])tipAt=m;
    const A=run.slice(0,tipAt+1),B=run.slice(tipAt);
    const rungs=[];
    for(const a of A){let best=-1,bd=1e9;for(const b of B){if(b===a)continue;const d=Math.abs(TU[b]-TU[a]);if(d<bd){bd=d;best=b}}
      if(best<0)continue;const w0=Math.hypot(Q0X[best]-Q0X[a],Q0Y[best]-Q0Y[a]);if(w0<h*.9)continue;   // 尖端太窄，分不出左右，不配
      rungs.push({a,b:best,w0})}
    rungs.sort((p,q)=>TU[p.a]-TU[q.a]);
    let s=0;for(let r=0;r<rungs.length;r++){const p=rungs[Math.max(0,r-1)],q=rungs[Math.min(rungs.length-1,r+1)],g=rungs[r];
      const tx=Q0X[q.a]+Q0X[q.b]-Q0X[p.a]-Q0X[p.b],ty=Q0Y[q.a]+Q0Y[q.b]-Q0Y[p.a]-Q0Y[p.b];
      s+=Math.sign(tx*(Q0Y[g.b]-Q0Y[g.a])-ty*(Q0X[g.b]-Q0X[g.a]))}
    // 中軸每一節的靜止長度（給軸線不折返用）；根部參考點＝環上緊貼這段觸手兩端的身體粒子
    const ref=[bnd[(start+nb-1)%nb],bnd[(start+pos.length)%nb]];
    for(let r=0;r<rungs.length;r++){const g=rungs[r];let mx,my;
      if(r===0){mx=(Q0X[g.a]+Q0X[g.b]-Q0X[ref[0]]-Q0X[ref[1]])*.5;my=(Q0Y[g.a]+Q0Y[g.b]-Q0Y[ref[0]]-Q0Y[ref[1]])*.5}
      else{const p=rungs[r-1];mx=(Q0X[g.a]+Q0X[g.b]-Q0X[p.a]-Q0X[p.b])*.5;my=(Q0Y[g.a]+Q0Y[g.b]-Q0Y[p.a]-Q0Y[p.b])*.5}
      g.hs=Math.max(h*.3,Math.hypot(mx,my))}
    RUNGS.push(rungs);RS.push(s>=0?1:-1);RUNGREF.push(ref);
  }
}
function buildClusters(){
  // 區塊：重疊的圓，蓋滿身體。區塊越小越軟、越像果凍；越大越像一塊
  clusters=[];
  const cs=R*mat.cSpace,cr=R*mat.cRad;
  for(let cy=-2.6*R;cy<=2.6*R;cy+=cs)for(let cx=-2.6*R;cx<=2.6*R;cx+=cs){
    const idx=[];for(let i=0;i<N;i++)if(Math.hypot(Q0X[i]-cx,Q0Y[i]-cy)<cr)idx.push(i);
    if(idx.length>=5)clusters.push({idx:Int32Array.from(idx),w:1,cs:1,sn:0,xc:0,yc:0,qcx:0,qcy:0});
  }
  const all=[];for(let i=0;i<N;i++)all.push(i);
  globalC={idx:Int32Array.from(all),w:mat.wGlobal,cs:1,sn:0,xc:0,yc:0,qcx:0,qcy:0};
  clusters.push(globalC);
  lastC={cSpace:mat.cSpace,cRad:mat.cRad};
}

/* ---------- 聲音：真實錄音切片（sfx/manifest.json），沒有檔案就安靜 ---------- */
const SFX={ctx:null,manifest:null,buf:{press:[],pull:[],release:[],rub:[]},master:null,muted:false,rubSrc:null,rubGain:null,pitchJit:.08};
fetch('sfx/manifest.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(m=>{SFX.manifest=m}).catch(()=>{});
function sfxInit(){ // iOS 規定：要在第一次觸碰裡建立音訊
  if(SFX.ctx||!SFX.manifest)return;const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  SFX.ctx=new C();SFX.master=SFX.ctx.createGain();SFX.master.gain.value=SFX.muted?0:.9;SFX.master.connect(SFX.ctx.destination);
  for(const k of Object.keys(SFX.buf))for(const f of (SFX.manifest[k]||[]))
    fetch('sfx/'+f).then(r=>r.arrayBuffer()).then(ab=>SFX.ctx.decodeAudioData(ab)).then(b=>SFX.buf[k].push(b)).catch(()=>{});
}
function sfxPlay(kind,gain=1,rate=1){const c=SFX.ctx;if(!c||SFX.muted)return;const list=SFX.buf[kind];if(!list.length)return;
  if(c.state==='suspended')c.resume();
  const b=list[Math.floor(Math.random()*list.length)],src=c.createBufferSource(),g=c.createGain();
  src.buffer=b;src.playbackRate.value=rate*(1+(Math.random()*2-1)*SFX.pitchJit);g.gain.value=Math.max(0,Math.min(1,gain));
  src.connect(g);g.connect(SFX.master);src.start()}
function sfxRub(level){ // 持續揉：一段 loop，音量跟手指速度
  const c=SFX.ctx;if(!c)return;
  if(!SFX.rubSrc){const list=SFX.buf.rub;if(!list.length||level<=0)return;const src=c.createBufferSource(),g=c.createGain();
    src.buffer=list[Math.floor(Math.random()*list.length)];src.loop=true;src.playbackRate.value=1+(Math.random()*2-1)*SFX.pitchJit;
    g.gain.value=0;src.connect(g);g.connect(SFX.master);src.start();SFX.rubSrc=src;SFX.rubGain=g}
  SFX.rubGain.gain.setTargetAtTime(SFX.muted?0:level,c.currentTime,.06)}
$('b-mute').addEventListener('click',()=>{SFX.muted=!SFX.muted;$('b-mute').setAttribute('aria-pressed',String(SFX.muted));$('b-mute').textContent=SFX.muted?'🔇':'🔈';
  if(SFX.master)SFX.master.gain.setTargetAtTime(SFX.muted?0:.9,SFX.ctx.currentTime,.02)});

/* ---------- 手指 ---------- */
const fingers=new Map();
function pos(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function insideBody(x,y){let c=false;const n=bnd.length;
  for(let i=0,j=n-1;i<n;j=i++){const ax=X[bnd[i]],ay=Y[bnd[i]],bx=X[bnd[j]],by=Y[bnd[j]];
    if(((ay>y)!==(by>y))&&(x<(bx-ax)*(y-ay)/(by-ay)+ax))c=!c}return c}
function nearBody(x,y,rad){for(const i of bnd)if(Math.hypot(X[i]-x,Y[i]-y)<rad)return true;return false}
function down(e){
  if(e.target!==cv)return;
  const p=pos(e);
  const grab=insideBody(p.x,p.y)||nearBody(p.x,p.y,R*.22);
  const f={id:e.pointerId,ax:p.x,ay:p.y,x:p.x,y:p.y,fx:p.x,fy:p.y,lx:p.x,ly:p.y,vx:0,vy:0,vxS:0,vyS:0,peak:0,stretch:0,
    tDown:t,press:0,pressOn:false,hold:0,pushed:false,step:0,mode:grab?'grab':'push',mem:[]};
  sfxInit();if(grab)sfxPlay('press',.7)
  if(grab){
    // mem：[粒子, 相對手指的偏移 ox oy, 跟手權重 w, 攤開方向 dx dy（單位向量 × (1-u²)²，按壓用）]
    const gr=mat.grabR*R;
    for(let i=0;i<N;i++){const ox=X[i]-p.x,oy=Y[i]-p.y,d=Math.hypot(ox,oy);if(d<gr&&!GRAB[i]){const u=d/gr,wp=(1-u*u)**2,inv=d>1e-6?wp/d:0;f.mem.push([i,ox,oy,Math.exp(-u*u*2.5)*(1-u*u),ox*inv,oy*inv]);GRAB[i]=1}}
    if(!f.mem.length){const o=[];for(let i=0;i<N;i++)o.push([Math.hypot(X[i]-p.x,Y[i]-p.y),i]);o.sort((a,b)=>a[0]-b[0]);
      for(let k=0;k<6;k++){const i=o[k][1],ox=X[i]-p.x,oy=Y[i]-p.y,d=Math.hypot(ox,oy),inv=d>1e-6?1/d:0;f.mem.push([i,ox,oy,1,ox*inv,oy*inv]);GRAB[i]=1}}
  }
  fingers.set(e.pointerId,f);try{cv.setPointerCapture(e.pointerId)}catch(_){}
  $('hint').classList.add('off');
}
function move(e){const f=fingers.get(e.pointerId);if(!f)return;const p=pos(e);f.x=p.x;f.y=p.y}
function up(e){const f=fingers.get(e.pointerId);if(!f)return;for(const m of f.mem)GRAB[m[0]]=0;fingers.delete(e.pointerId);lastTouch=t;
  // 放手強度：甩多快（最近 80 毫秒的峰值速度）與拉多遠（tanh 後的拉伸 ÷ 上限）取大，慢慢鬆手也有啵
  if(f.mode==='grab'){const sv=Math.min(1,f.peak/R/6),ss=Math.min(1,f.stretch/mat.maxPull)**1.5;let s=Math.max(sv,ss);
    // 候選 2：每 specialEvery 次放手（±2）來一次特別回彈：0.35 秒內多晃一下、啵大 1.3 倍
    releaseCount++;if(mat.specialEvery>0){const every=Math.round(mat.specialEvery),jit=()=>Math.floor(Math.random()*5)-2;
      if(nextSpecial===0)nextSpecial=Math.max(1,every+jit());
      if(releaseCount>=nextSpecial){specialUntil=t+.35;nextSpecial=Math.max(releaseCount+1,releaseCount+every+jit());s=Math.min(1,s*1.3)}}
    sfxPlay('release',.35+.65*s,1+.1*s)}
  if(!fingers.size)sfxRub(0)}
function cancel(e){ // 系統把觸控收走（手勢、來電）：安靜放開，不啵
  const f=fingers.get(e.pointerId);if(!f)return;for(const m of f.mem)GRAB[m[0]]=0;fingers.delete(e.pointerId);lastTouch=t;if(!fingers.size)sfxRub(0)}
cv.addEventListener('pointerdown',down);cv.addEventListener('pointermove',move);
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',cancel);

/* ---------- 物理 ---------- */
const SUB=4;
function substep(dt,L,Lamp,tl){   // L：管速率類（搖、抖、遊走的門檻）；Lamp、tl：相位類（呼吸、蠕動、飄、浮）的振幅與時鐘
  // 候選 2 偶發特別回彈：放手後 0.35 秒內硬一點、阻尼少一點，多晃一下
  const special=t<specialUntil,damp=Math.min(.995,mat.damp+(special?.03:0)),alpha=mat.alpha*(special?1.25:1),beta=mat.beta;
  const G=FLOAT?0:R*7;
  // 1 積分（Verlet）
  for(let i=0;i<N;i++){const vx=(X[i]-PX[i])*damp,vy=(Y[i]-PY[i])*damp;PX[i]=X[i];PY[i]=Y[i];X[i]+=vx;Y[i]+=vy+G*dt*dt}
  // 2 手指
  for(const f of fingers.values()){
    if(f.mode==='grab'){
      // 按壓：被抓那塊沿「手指→粒子」方向多攤開 press（接觸點先凹；側視圖裡按進去畫不出深度，用壓扁表現）
      for(const [i,ox,oy,w,dx,dy] of f.mem){const tx=f.fx+ox+dx*f.press,ty=f.fy+oy+dy*f.press,k=.55*w;X[i]+=(tx-X[i])*k;Y[i]+=(ty-Y[i])*k}
    }else{
      const rf=R*.22;let hit=false;
      for(let i=0;i<N;i++){const dx=X[i]-f.fx,dy=Y[i]-f.fy,d=Math.hypot(dx,dy);
        if(d<rf&&d>1e-6){const s=(rf-d)/d;X[i]+=dx*s;Y[i]+=dy*s;hit=true}}
      if(hit&&!f.pushed){f.pushed=true;sfxPlay('press',.5)}  // 從外面推進來第一次碰到也要有聲音
    }
  }
  // 活物：呼吸。寫在「參考形狀」上（所有區塊一致），不是寫在目標上，否則小區塊會跟著滑開拉不回來
  const bs=Lamp*mat.life*.045*Math.sin(tl*2*Math.PI/3.8),bsx=1+bs,bsy=1-bs*.85;
  // 活物：蠕動。幾個慢速行進波掃過參考形狀，輪廓每一刻都在變（多米：平常就要在蠕動）
  const wr=Lamp*mat.life*mat.wriggle*R,swA=Lamp*mat.life*mat.drift*R,iR=1/R;
  for(let i=0;i<N;i++){let ex=QX[i],ey=QY[i];
    if(wr!==0){const qx=ex*iR,qy=ey*iR;
      ex+=wr*(.6*Math.sin(1.7*qy+tl*1.3+.3)+.4*Math.sin(2.3*qx-tl*1.0+1.7));
      ey+=wr*(.6*Math.sin(1.9*qx-tl*1.1+2.1)+.4*Math.sin(2.1*qy+tl*1.6+.6))}
    const k=TID[i];
    if(k>=0&&swA!==0){const tt=TENT[k],u=TUB[i],ph=(Math.sin(tl*2*Math.PI/(4.2+k*.9)+k*2.1)+.35*Math.sin(tl*2*Math.PI/(1.9+k*.4)+k))*swA*u*u;
      ex+=-tt.uy*ph;ey+=tt.ux*ph}
    EX[i]=ex;EY[i]=ey}
  // 3 形狀匹配
  GX.fill(0);GY.fill(0);GW.fill(0);
  globalC.w=mat.wGlobal;
  for(const c of clusters){
    const idx=c.idx,n=idx.length;let xc=0,yc=0,qcx=0,qcy=0;
    for(let k=0;k<n;k++){const i=idx[k];xc+=X[i];yc+=Y[i];qcx+=EX[i];qcy+=EY[i]}
    xc/=n;yc/=n;qcx/=n;qcy/=n;
    let a=0,b=0,cc=0,d=0,qxx=0,qxy=0,qyy=0;
    for(let k=0;k<n;k++){const i=idx[k],px=X[i]-xc,py=Y[i]-yc,qx=(EX[i]-qcx)*bsx,qy=(EY[i]-qcy)*bsy;
      a+=px*qx;b+=px*qy;cc+=py*qx;d+=py*qy;qxx+=qx*qx;qxy+=qx*qy;qyy+=qy*qy}
    // 旋轉（極分解）
    const ang=Math.atan2(cc-b,a+d),cs=Math.cos(ang),sn=Math.sin(ang);
    // 線性（面積守恆）
    let T00=cs,T01=-sn,T10=sn,T11=cs;
    const det=qxx*qyy-qxy*qxy;
    if(beta>0&&Math.abs(det)>1e-9){
      const inv=1/det;
      const i00=qyy*inv,i01=-qxy*inv,i11=qxx*inv;
      let A00=a*i00+b*i01,A01=a*i01+b*i11,A10=cc*i00+d*i01,A11=cc*i01+d*i11;
      const da=A00*A11-A01*A10;
      if(da>1e-6){const s=1/Math.sqrt(da);A00*=s;A01*=s;A10*=s;A11*=s;
        T00=beta*A00+(1-beta)*cs;T01=beta*A01-(1-beta)*sn;T10=beta*A10+(1-beta)*sn;T11=beta*A11+(1-beta)*cs}
    }
    c.cs=cs;c.sn=sn;c.xc=xc;c.yc=yc;c.qcx=qcx;c.qcy=qcy;
    const w=c.w;
    for(let k=0;k<n;k++){const i=idx[k],qx=(EX[i]-qcx)*bsx,qy=(EY[i]-qcy)*bsy;
      GX[i]+=(xc+T00*qx+T01*qy)*w;GY[i]+=(yc+T10*qx+T11*qy)*w;GW[i]+=w}
  }
  // 面積壓力：被壓扁、被拉長時面積掉，就把目標整體往外推，旁邊自然鼓出來
  let A=0;{const n=bnd.length;for(let i=0;i<n;i++){const a=bnd[i],b=bnd[(i+1)%n];A+=X[a]*Y[b]-X[b]*Y[a]}A=Math.abs(A)/2}
  const ap=Math.max(-.12,Math.min(.12,(Math.sqrt(A0/A)-1)*mat.areaGain));
  const cx=globalC.xc,cy=globalC.yc;
  for(let i=0;i<N;i++){
    let gx=GX[i]/GW[i],gy=GY[i]/GW[i];
    gx=cx+(gx-cx)*(1+ap);gy=cy+(gy-cy)*(1+ap);
    const ka=alpha*KF[i];X[i]+=(gx-X[i])*ka;Y[i]+=(gy-Y[i])*ka;
  }
  // 回正：轉回頭朝上。純運動學（位置與前一幀一起轉，不留速度），所以不會過衝、不會翻身；抓著時加強
  const gAng=Math.atan2(globalC.sn,globalC.cs);
  const grabbing=fingers.size>0;
  const rotK=-gAng*Math.min(.2,mat.upright*(grabbing?mat.anchor*mat.gripRot:1));
  if(rotK!==0){const c=Math.cos(rotK),sn=Math.sin(rotK);
    for(let i=0;i<N;i++){if(GRAB[i])continue;
      let dx=X[i]-cx,dy=Y[i]-cy;X[i]=cx+dx*c-dy*sn;Y[i]=cy+dx*sn+dy*c;
      dx=PX[i]-cx;dy=PY[i]-cy;PX[i]=cx+dx*c-dy*sn;PY[i]=cy+dx*sn+dy*c}}
  // 活物：慢慢搖。純表演位移：位置與前一幀一起搬，不留速度，否則在 Verlet 裡會變成角加速度一路累積
  const sway=L*mat.life*.0009*Math.sin(t*2*Math.PI/5.3);
  if(sway!==0)for(let i=0;i<N;i++){if(GRAB[i])continue;const dx=X[i]-cx,dy=Y[i]-cy,mx=-dy*sway,my=dx*sway;X[i]+=mx;Y[i]+=my;PX[i]+=mx;PY[i]+=my}
  // 3b 邊界像一條繩子：相鄰邊界粒子距離夾在 [0.55, 2.4] 倍靜止距離，一顆不能被單獨拽走（防自交）
  {const n=bnd.length;for(let pass=0;pass<2;pass++)for(let k=0;k<n;k++){const i=bnd[k],j=bnd[(k+1)%n];
    const tent=TID[i]>=0||TID[j]>=0;
    const dx=X[j]-X[i],dy=Y[j]-Y[i],d=Math.hypot(dx,dy)||1e-6,l0=bndL[k],lo=l0*.6,hi=l0*(tent?1.7:2.4);
    let c=0;if(d>hi)c=(d-hi)/d;else if(d<lo)c=(d-lo)/d;if(c===0)continue;
    const wi=GRAB[i]?.15:.5,wj=GRAB[j]?.15:.5,sw=wi+wj;
    X[i]+=dx*c*wi/sw;Y[i]+=dy*c*wi/sw;X[j]-=dx*c*wj/sw;Y[j]-=dy*c*wj/sw}}
  // 3c 粒子互不穿透：最小距離 0.6h（靜止時最近的兩顆約 0.7h，所以靜止時不作用），用格子雜湊找鄰居。只在「同一條觸手內」與「身體內」擋（防拉細、防對折）；
  //    不同觸手之間、觸手與身體之間允許交疊（2D 裡就是一條在前面），否則拉過去的觸手會被卡住解不開
  {const dmin=h*.6,dmin2=dmin*dmin,cs=dmin,inv=1/cs;const grid=new Map();   // 0.6h：低於任何靜止間距，不會跟形狀匹配打架
    for(let i=0;i<N;i++){const key=((X[i]*inv)|0)*73856+((Y[i]*inv)|0);let a=grid.get(key);if(!a){a=[];grid.set(key,a)}a.push(i)}
    for(let i=0;i<N;i++){const gx=(X[i]*inv)|0,gy=(Y[i]*inv)|0;
      for(let ox=-1;ox<=1;ox++)for(let oy=-1;oy<=1;oy++){const a=grid.get((gx+ox)*73856+(gy+oy));if(!a)continue;
        for(const j of a){if(j<=i||TID[j]!==TID[i])continue;
          // 邊界環上相鄰幾顆（凹角處直線距離本來就近）交給繩子約束管，不在這裡推，否則凹角會被推成一個圈。
          // 粒子式互不穿透擋不住「線段交叉」（它只知道距離不知道方向）；觸手被壓縮時的對折由下面 3d 的橫檔與中軸約束擋（第 41 條）
          if(BIDX[i]>=0&&BIDX[j]>=0){const nb=bnd.length,di=Math.abs(BIDX[i]-BIDX[j]);if(Math.min(di,nb-di)<=8)continue}
          const dx=X[j]-X[i],dy=Y[j]-Y[i],d2=dx*dx+dy*dy;if(d2>=dmin2||d2<1e-9)continue;
          const d=Math.sqrt(d2),c=(dmin-d)/d,wi=GRAB[i]?.3:1,wj=GRAB[j]?.3:1,sw=wi+wj;
          X[i]-=dx*c*wi/sw;Y[i]-=dy*c*wi/sw;X[j]+=dx*c*wj/sw;Y[j]+=dy*c*wj/sw}}}}
  // 3d 觸手橫檔（第 41 條候選 h）：每條觸手兩邊成對的粒子，對面那顆一定要在正確的那一側，而且寬度不低於靜止寬度的 tentRung 倍。
  //    粒子式互不穿透只知道距離不知道方向，兩邊交換之後反而把它們推得更錯；橫檔知道哪邊是哪邊，擋得住對折，順便擋拉成細線
  if(mat.tentRung>0)for(let k=0;k<RUNGS.length;k++){const rungs=RUNGS[k],s0=RS[k],nr=rungs.length;if(nr<2)continue;
    for(let r=0;r<nr;r++){const p=rungs[Math.max(0,r-1)],q=rungs[Math.min(nr-1,r+1)],g=rungs[r];
      let tx=X[q.a]+X[q.b]-X[p.a]-X[p.b],ty=Y[q.a]+Y[q.b]-Y[p.a]-Y[p.b];const tl=Math.hypot(tx,ty)||1e-6;tx/=tl;ty/=tl;
      const nx=-ty*s0,ny=tx*s0;   // 單位法線，從 a 那一側指向 b 那一側
      const dx=X[g.b]-X[g.a],dy=Y[g.b]-Y[g.a],wmin=g.w0*mat.tentRung,wa=GRAB[g.a]?.3:1,wb=GRAB[g.b]?.3:1,sw=wa+wb;
      const cn=dx*nx+dy*ny;
      if(cn<wmin){const delta=(wmin-cn)*.6;X[g.a]-=nx*delta*wa/sw;Y[g.a]-=ny*delta*wa/sw;X[g.b]+=nx*delta*wb/sw;Y[g.b]+=ny*delta*wb/sw}}
    // 軸線不能原地折返：觸手的中軸（橫檔中點連成的鏈）每一節在上一節方向上要前進至少靜止節距的 tentAxis 倍。
    // 對折時每根橫檔對自己的局部軸線都還對，是中軸本身在一節之內掉頭 180 度，兩截疊在一起；根部的參考方向用身體接點
    if(mat.tentAxis>0){const rp=RUNGREF[k];
      for(let r=0;r<nr;r++){const g=rungs[r];let ux,uy;
        if(r===0){ux=(X[g.a]+X[g.b])*.5-(X[rp[0]]+X[rp[1]])*.5;uy=(Y[g.a]+Y[g.b])*.5-(Y[rp[0]]+Y[rp[1]])*.5}
        else{const p=rungs[r-1];ux=(X[g.a]+X[g.b]-X[p.a]-X[p.b])*.5;uy=(Y[g.a]+Y[g.b]-Y[p.a]-Y[p.b])*.5}
        if(r===nr-1)break;const q=rungs[r+1];const ul=Math.hypot(ux,uy)||1e-6;ux/=ul;uy/=ul;
        const sx=(X[q.a]+X[q.b]-X[g.a]-X[g.b])*.5,sy=(Y[q.a]+Y[q.b]-Y[g.a]-Y[g.b])*.5,s=sx*ux+sy*uy,hmin=q.hs*mat.tentAxis;
        if(s>=hmin)continue;
        const delta=(hmin-s)*.5,wq=(GRAB[q.a]||GRAB[q.b])?.3:1,wg=(GRAB[g.a]||GRAB[g.b])?.3:1,sw=wq+wg;
        X[q.a]+=ux*delta*wq/sw;Y[q.a]+=uy*delta*wq/sw;X[q.b]+=ux*delta*wq/sw;Y[q.b]+=uy*delta*wq/sw;
        X[g.a]-=ux*delta*wg/sw;Y[g.a]-=uy*delta*wg/sw;X[g.b]-=ux*delta*wg/sw;Y[g.b]-=uy*delta*wg/sw}}}
  // 4 回家（懸空時較強），邊界，地面
  const hx=HOMEX+Lamp*mat.life*R*.035*Math.sin(tl*2*Math.PI/7.3),hy=HOMEY+(FLOAT?Lamp*mat.life*R*.05*Math.sin(tl*2*Math.PI/4.7):0);
  const kh=(FLOAT?.02:.006)*(grabbing?mat.anchor:1),dx=hx-cx,dy=hy-cy;
  const padT=90,padB=H-120,padL=8,padR=W-8;
  for(let i=0;i<N;i++){
    if(!GRAB[i]){X[i]+=dx*kh;Y[i]+=dy*kh}
    if(!FLOAT&&Y[i]>GROUND){Y[i]=GROUND;PX[i]+=(X[i]-PX[i])*.45}
    if(Y[i]<padT)Y[i]=padT;if(Y[i]>padB)Y[i]=padB;if(X[i]<padL)X[i]=padL;if(X[i]>padR)X[i]=padR;
  }
}
function plasticity(dt){
  // 每顆粒子在「參考座標」裡現在的位置（只用旋轉反推，平均各區塊）
  RX.fill(0);RY.fill(0);
  const cnt=new Float64Array(N);
  for(const c of clusters){const {idx,cs,sn,xc,yc,qcx,qcy,w}=c;
    for(let k=0;k<idx.length;k++){const i=idx[k],px=X[i]-xc,py=Y[i]-yc;
      RX[i]+=(qcx+cs*px+sn*py)*w;RY[i]+=(qcy-sn*px+cs*py)*w;cnt[i]+=w}}
  const grabs=[...fingers.values()].filter(f=>f.mode==='grab'),touched=grabs.length>0;
  if(t<relaxUntil){
    // 揉回原形：記住的形狀半秒內淡回原樣，位置不動，身體自己揉回去（不瞬移）
    const kr=Math.min(1,6*dt);for(let i=0;i<N;i++){QX[i]+=(Q0X[i]-QX[i])*kr;QY[i]+=(Q0Y[i]-QY[i])*kr}
  }else if(touched){
    // 只有抓住一陣子才開始記形：dwellLo 秒內純彈性（輕按、快彈都回彈），dwellHi 秒後全速（揉捏即留形）
    let g=0;const lo=mat.dwellLo,hi=Math.max(lo+1e-3,mat.dwellHi);
    for(const f of grabs){const x=Math.max(0,Math.min(1,(t-f.tDown-lo)/(hi-lo)));g=Math.max(g,x*x*(3-2*x))}
    const yl=mat.yield*R,kc=Math.min(1,mat.creep*dt*g);
    if(kc>0)for(let i=0;i<N;i++){const rx=RX[i]/cnt[i],ry=RY[i]/cnt[i],dx=rx-QX[i],dy=ry-QY[i],dl=Math.hypot(dx,dy);
      if(dl>yl){const s=(1-yl/dl)*kc*(TID[i]>=0?1-.85*TU[i]:1);QX[i]+=dx*s;QY[i]+=dy*s;
        const ex=QX[i]-Q0X[i],ey=QY[i]-Q0Y[i],el=Math.hypot(ex,ey),lim=R*1.1;
        if(el>lim){QX[i]=Q0X[i]+ex*lim/el;QY[i]=Q0Y[i]+ey*lim/el}}}
  }else{
    const kr=Math.min(1,mat.recover*dt);
    if(kr>0)for(let i=0;i<N;i++){QX[i]+=(Q0X[i]-QX[i])*kr;QY[i]+=(Q0Y[i]-QY[i])*kr}
  }
  // 觸手的記憶很淡：不管有沒有被碰，末端都會慢慢彈回原本的長度與粗細（身體才是黏土）
  {const kt=Math.min(1,.8*dt);for(let i=0;i<N;i++){if(TID[i]<0)continue;const w=kt*TU[i];QX[i]+=(Q0X[i]-QX[i])*w;QY[i]+=(Q0Y[i]-QY[i])*w}}
  // 參考形狀重新置中，避免慢慢漂
  let mx=0,my=0;for(let i=0;i<N;i++){mx+=QX[i];my+=QY[i]}mx/=N;my/=N;
  for(let i=0;i<N;i++){QX[i]-=mx;QY[i]-=my}
}
function relax(){relaxUntil=t+.5}   // 「揉回原形」按鈕：半秒內記憶淡回 Q0，換種子才重建
function twitch(L){
  // 偶爾抖一下：隨機一個區塊得到一個小衝量；偶爾整團輕晃
  if(t<nextTwitch)return;
  nextTwitch=t+2.2+Math.random()*4.5;
  if(L<.5||mat.life<=0)return;
  // 衝量是「每小步的位移」：R*.0012 ≈ 每秒 0.3 個半徑的速度
  const amp=R*.0012*mat.life*(REDUCED?.5:1);
  const whole=Math.random()<.25;
  const c=whole?globalC:clusters[Math.floor(Math.random()*(clusters.length-1))];
  const a=Math.random()*Math.PI*2,ix=Math.cos(a)*amp*(whole?.6:1),iy=Math.sin(a)*amp*(whole?.6:1);
  for(let k=0;k<c.idx.length;k++){const i=c.idx[k];if(GRAB[i])continue;PX[i]-=ix;PY[i]-=iy}
}
function update(dt){
  t+=dt;
  if(mat.seed!==lastShape.seed||mat.floppy!==lastShape.floppy){setup()}
  else if(mat.cSpace!==lastC.cSpace||mat.cRad!==lastC.cRad){buildClusters()}
  // 手指黏滯：有效位置 = 起點 + tanh 軟上限的位移，再慢慢跟
  for(const f of fingers.values()){
    let ex=f.x-f.ax,ey=f.y-f.ay;const el=Math.hypot(ex,ey),lim=mat.maxPull*R;
    if(f.mode==='grab'&&el>0){const s=lim*Math.tanh(el/lim)/el;ex*=s;ey*=s}
    const tx=f.ax+ex,ty=f.ay+ey,k=mat.lag>0?1-Math.exp(-dt/mat.lag):1;
    f.fx+=(tx-f.fx)*k;f.fy+=(ty-f.fy)*k;
    // 速度：單幀差分太吵，另存 30 毫秒平滑版與 80 毫秒衰減峰值（放手強度用峰值，揉的音量用平滑版）
    f.vx=(f.x-f.lx)/dt;f.vy=(f.y-f.ly)/dt;f.lx=f.x;f.ly=f.y;
    {const kv=1-Math.exp(-dt/.03);f.vxS+=(f.vx-f.vxS)*kv;f.vyS+=(f.vy-f.vyS)*kv;f.peak=Math.max(Math.hypot(f.vx,f.vy),f.peak*Math.exp(-dt/.08))}
    if(f.mode==='grab'){const st=Math.hypot(ex,ey)/R,step=Math.floor(st*2.5);f.stretch=st;if(step>f.step&&st>.35)sfxPlay('pull',Math.min(1,.4+st/2),1-.08*Math.min(1,st/1.5));f.step=Math.max(f.step,step);
      // 按壓（接觸點先凹）：按下那幀先到目標的 pressFirst，之後用 pressRise 補完；按住不動（慢於每秒一個半徑）再慢慢攤深
      const still=Math.hypot(f.vxS,f.vyS)<R;f.hold=Math.max(0,Math.min(1,f.hold+(still?dt/Math.max(.05,mat.pressHoldTime):-dt/.3)));
      const target=R*(mat.pressBase+mat.pressHold*f.hold);
      if(!f.pressOn){f.press=target*mat.pressFirst;f.pressOn=true}else f.press+=(target-f.press)*(1-Math.exp(-dt/Math.max(.005,mat.pressRise)))}
  }
  { // 持續揉：抓著時手指速度越快越大聲（用平滑速度，單幀差分會抖）
    let sp=0;for(const f of fingers.values())if(f.mode==='grab')sp=Math.max(sp,Math.hypot(f.vxS,f.vyS)/R);
    sfxRub(fingers.size?Math.min(1,sp/5)*.7:0)}
  // 活物感：沒人碰才開，放手後 1 秒內淡入
  const idle=fingers.size?0:Math.min(1,Math.max(0,(t-lastTouch-.8)/1.2));
  const L=idle*(REDUCED?.5:1);
  // 候選 19：碰到時活物感「凍住」不歸零。振幅不乘 L，只有時鐘停；L 照舊管搖、抖、遊走
  tLife+=dt*L;const freeze=mat.idleFreeze>=.5,Lamp=freeze?(REDUCED?.5:1):L,tl=freeze?tLife:t;
  // 活物：遊走。沒碰時家會慢慢移動，走一段、停一下；碰它就停在原地
  if(L>.5&&mat.wander>0){
    if(!WANDER.moving&&t>WANDER.next){WANDER.dx=CX+(Math.random()-.5)*W*.36;WANDER.dy=CY+(Math.random()-.5)*H*.16;WANDER.moving=true}
    if(WANDER.moving){const sp=mat.wander*R*dt*L,ddx=WANDER.dx-HOMEX,ddy=WANDER.dy-HOMEY,dl=Math.hypot(ddx,ddy);
      if(dl<sp*2){HOMEX=WANDER.dx;HOMEY=WANDER.dy;WANDER.moving=false;WANDER.next=t+1.5+Math.random()*5}
      else{HOMEX+=ddx/dl*sp;HOMEY+=ddy/dl*sp}}
  }else if(fingers.size){WANDER.moving=false;WANDER.next=t+2+Math.random()*3}
  const sdt=dt/SUB;
  for(let s=0;s<SUB;s++)substep(sdt,L,Lamp,tl);
  plasticity(dt);
  twitch(L);
}

/* ---------- 繪圖（平塗卡通） ---------- */
function bodyPath(P,ox=0,oy=0){const n=P.length;ctx.beginPath();
  for(let i=0;i<n;i++){const p0=P[(i+n-1)%n],p1=P[i],p2=P[(i+1)%n],p3=P[(i+2)%n];
    if(i===0)ctx.moveTo(p1[0]+ox,p1[1]+oy);
    const c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6,c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;
    ctx.bezierCurveTo(c1x+ox,c1y+oy,c2x+ox,c2y+oy,p2[0]+ox,p2[1]+oy)}
  ctx.closePath()}
function boundaryPts(){const n=bnd.length,P=new Array(n);
  for(let i=0;i<n;i++){const a=bnd[(i+n-1)%n],b=bnd[i],c=bnd[(i+1)%n];
    P[i]=[X[a]*.25+X[b]*.5+X[c]*.25,Y[a]*.25+Y[b]*.5+Y[c]*.25]}return P}
function draw(){
  const css=getComputedStyle(document.documentElement),col=n=>css.getPropertyValue(n).trim();
  ctx.clearRect(0,0,W,H);
  // 背景
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,col('--sky'));g.addColorStop(1,col('--sky2'));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(!FLOAT){ctx.fillStyle=col('--grass');ctx.fillRect(0,GROUND,W,H-GROUND);ctx.fillStyle=col('--grass-line');ctx.fillRect(0,GROUND,W,3)}
  const P=boundaryPts();
  let minX=1e9,maxX=-1e9,maxY=-1e9,cx=globalC.xc,cy=globalC.yc;
  for(const p of P){minX=Math.min(minX,p[0]);maxX=Math.max(maxX,p[0]);maxY=Math.max(maxY,p[1])}
  // 影子
  const sw=(maxX-minX)*.5,sy=FLOAT?Math.max(maxY,CY+R*1.2)+R*.35:GROUND+10;
  const lift=FLOAT?Math.max(0,Math.min(1,(sy-maxY)/(R*1.2))):0;
  ctx.fillStyle=`rgba(60,90,40,${FLOAT?.10+.08*(1-lift):.16})`;
  ctx.beginPath();ctx.ellipse(cx,sy,sw*(FLOAT?.7+.3*(1-lift):1.05),R*.11*(FLOAT?.8:1),0,0,Math.PI*2);ctx.fill();
  ctx.save();
  if(!FLOAT){ctx.beginPath();ctx.rect(0,0,W,GROUND+2);ctx.clip()}
  // 身體：陰影色打底，再用往左上偏移的底色蓋住
  bodyPath(P);ctx.fillStyle=col('--shade');ctx.fill();
  ctx.save();bodyPath(P);ctx.clip();bodyPath(P,-R*.07,-R*.085);ctx.fillStyle=col('--body');ctx.fill();
  // 亮光：綁在左上粒子，跟著整體旋轉
  const hx=X[hiIdx],hy=Y[hiIdx],ang=Math.atan2(globalC.sn,globalC.cs);
  ctx.fillStyle=col('--hi');
  ctx.beginPath();ctx.ellipse(hx,hy,R*.17,R*.085,ang-.5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(hx+Math.cos(ang-.2)*R*.26,hy+Math.sin(ang-.2)*R*.26,R*.035,0,Math.PI*2);ctx.fill();
  ctx.restore();
  // 描邊
  bodyPath(P);ctx.lineWidth=Math.max(4,R*.034);ctx.lineJoin='round';ctx.strokeStyle=col('--line');ctx.stroke();
  ctx.restore();
}

/* ---------- 主迴圈 ---------- */
function frame(now){
  const dt=Math.min(1/30,Math.max(1/240,(now-last)/1000||1/60));last=now;
  update(dt);draw();requestAnimationFrame(frame);
}

/* ---------- UI ---------- */
function setMat(name){mat={...PRESETS[name]};for(const k of ['jelly','mochi','clay'])$('m-'+k).setAttribute('aria-pressed',String(k===name));syncSliders()}
for(const k of ['jelly','mochi','clay'])$('m-'+k).addEventListener('click',()=>setMat(k));
$('b-reset').addEventListener('click',()=>{relax()});   // 揉回原形：用動畫不瞬移（換種子才走 setup）
$('b-float').addEventListener('click',()=>{FLOAT=!FLOAT;$('b-float').setAttribute('aria-pressed',String(FLOAT));$('b-float').textContent=FLOAT?'懸空（多米定案）':'地面（對照用）';setup();dump()});
// 隱藏面板：長按標題 1.2 秒
let pressT=null;
$('brand').addEventListener('pointerdown',()=>{pressT=setTimeout(()=>{$('tune').classList.toggle('hidden')},1200)});
for(const ev of ['pointerup','pointerleave','pointercancel'])$('brand').addEventListener(ev,()=>clearTimeout(pressT));
$('t-close').addEventListener('click',()=>$('tune').classList.add('hidden'));
$('t-copy').addEventListener('click',()=>{const s=$('t-out').value;navigator.clipboard&&navigator.clipboard.writeText(s)});
// 第二批候選（網頁版只有這三條；觸覺類在 Swift 版）。一次只套一條，先記下對照值再比
$('cands').addEventListener('click',e=>{const c=e.target.getAttribute('data-c');if(!c)return;
  if(c==='6')mat.lag=.03;else if(c==='19')mat.idleFreeze=1;else if(c==='2')mat.specialEvery=8;else if(c==='41'){mat.tentRung=0;mat.tentAxis=0}
  for(const k of ['jelly','mochi','clay'])$('m-'+k).setAttribute('aria-pressed','false');syncSliders()});
const sl={};
(function buildSliders(){const host=$('sliders');
  for(const [key,name,hint,min,max,step] of F){
    const lab=document.createElement('label');
    lab.innerHTML=`<span>${name}</span><output></output><small>${hint}</small><input type="range" min="${min}" max="${max}" step="${step}">`;
    const inp=lab.querySelector('input'),out=lab.querySelector('output');
    inp.addEventListener('input',()=>{mat[key]=parseFloat(inp.value);out.textContent=inp.value;dump();
      for(const k of ['jelly','mochi','clay'])$('m-'+k).setAttribute('aria-pressed','false')});
    host.appendChild(lab);sl[key]={inp,out};
  }})();
function syncSliders(){for(const k in sl){sl[k].inp.value=mat[k];sl[k].out.textContent=String(mat[k])}dump()}
function dump(){$('t-out').value=JSON.stringify({...mat,float:FLOAT})}

addEventListener('resize',()=>{setup()});
setup();syncSliders();requestAnimationFrame(frame);
</script>
