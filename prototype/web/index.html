<style>

.tune label{display:grid;grid-template-columns:1fr auto;grid-template-areas:"name val" "hint hint" "range range";column-gap:8px;font-size:14px;font-weight:700}
.tune small{grid-area:hint;font-size:11.5px;font-weight:500;color:var(--ink-soft)}
.tune input[type=range]{grid-area:range;width:100%;accent-color:#2E3A2A;margin:2px 0 0}
.tune output{grid-area:val;font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink-soft)}
.tune-actions{display:flex;gap:8px}

/* =========================================================
   捏捏史萊姆 v2：形狀匹配軟體（Müller 2005）＋塑性＋活物感
   - 身體 = 一群粒子；每幀每個區塊算出「最接近的剛體／線性擺放」，粒子被拉回去
   - 永遠拉得回來、不爆、不打結（輪廓由邊界粒子依原始順序連成）
   - 塑性：變形超過 yield 就慢慢改參考形狀（留形）；沒碰時參考形狀回原樣
   - 活物：沒碰時呼吸、慢搖、偶爾抖、懸空時上下浮
   - v2.3（手感精修提案第一批，2026-11-01）：按下去那塊往四周攤開（接觸點先凹，側視圖用壓扁表現）；
     放手強度看「拉多遠」與「甩多快」取大；抓住 0.2 秒內純彈性、0.6 秒後才全速記形（輕按回彈，揉捏即留形）；
     揉回原形用動畫不瞬移；系統收走觸控時安靜放開
   - v2.4（第二批候選，2026-11-01）：idleFreeze（碰到時活物感凍住不歸零）、specialEvery（偶發特別回彈）兩個開關，
     預設關（對照值）；面板「候選」按鈕一次套一條。觸覺類候選（12、13、14、9、38）只在 Swift 版
   - v2.5（提案第 41 條，2026-11-01）：觸手橫檔（tentRung）＋中軸不折返（tentAxis），抓觸手根部往尖端推不再對折；
     兩個都預設開，面板「41 對照：關橫檔」關掉當對照。量法在 selftest.js 的 T11（固定情境網格）
   - v2.6（第三批前五條，2026-11-01）：遊走走一段用 smoothstep 加減速、觸手拖尾（tail，寫在參考形狀上）、減少動態時遊走 ×0.25；
     第 30、32、35 條（顏色淡入、提示只前三次、待機 60Hz）只在 Swift 版。量法在 selftest.js 的 T12
   - v2.7（第三批其餘，2026-11-01）：全部做成參數、預設是對照值：21 回家彈簧（homeK）、22 放手餘韻（afterglow）、23 呼吸週期／不對稱／被摸久變深、
     24 兩指捏 squish 事件（預設開）、25 拉太遠滑脫（slip）、26 放手黏連（stick）、27 局部面積壓力（localArea）、33 家的高度（homeFrac）、
     34 描邊粗細隨壓縮（inkVar）；15、17、36 只在 Swift 版。量法在 selftest.js 的 T13 到 T16
   - v2.8（多米真機回報 build 46，2026-11-01）：蠕動改成平滑亂數（輪廓 2 到 5 階＋兩個繞著跑的鼓包，morph），幅度約兩倍；
     黏土抓到就記形（dwell 0／0.1、creep 6）、被抓的觸手也記形（tentMem，用整身座標、記住的形狀也套橫檔中軸與彎曲上限），
     放著約 10 秒退（recover 0.3）。面板「v2.7 對照」換回原本的。量法在 selftest.js 的 T17、T18
   - v2.9（多米第二次真機回報，2026-11-01）：沒有固定觸手（limbs 0），改成會伸縮的偽足（pods，隨機方向、上方也會長，伸 40% 停 20% 縮 40%）；
     水母呼吸（jelly，3 秒一縮一放，收縮快放鬆慢，收縮時上浮）；按鈕拿掉硬陰影。面板「v2.7 對照（舊外形）」換回海星外形與舊的記形。量法在 T19、T20
   - 音效：真實錄音切片。讀 sfx/manifest.json，分四類（press 按、pull 拉、release 放手、rub 持續揉），
     每類多段隨機挑、音高 ±8%、音量跟動作強度。沒有檔案就安靜。錄法見 .uiux/04-手感/錄音指南.md
   ========================================================= */

let TENT=[],PH=[];   // 觸手定義、團塊的亂數相位
let RUNGS=[],RS=[],RUNGREF=[];  // 每條觸手的橫檔（兩邊成對的邊界粒子）、靜止時的左右手性、根部參考點（第 41 條候選 h）
function rng(seed){let x=seed*9301+49297;return()=>{x=(x*9301+49297)%233280;return x/233280}}
function defineShape(){
  const r=rng(Math.round(mat.seed)*7+3);
  PH=[r()*6.28,r()*6.28,r()*6.28,(-72+(r()-.5)*30)*Math.PI/180];   // PH[3]：頭頂鼓包的角度
  // 角度：螢幕座標 y 向下，90° 是正下方。大多垂在下方與兩側，頂上一個短凸起當頭的方向感
  // 頂上的「頭」不用細觸手（尖端比粒子間距細會自交），改成團塊的鼓包（見 blobR）
  // 2026-11-01 多米：不是海星，沒有固定觸手；limbs 0 時只有團塊，伸出去的是會伸縮的偽足（POD，畫在參考形狀上）
  const base=[[100,2.1,.17],[55,1.8,.15],[140,1.65,.14],[8,1.5,.14],[198,1.35,.13]].slice(0,Math.round(mat.limbs));
  TENT=base.map(([deg,L,w])=>{const a=(deg+(r()-.5)*22)*Math.PI/180;
    // curl：靜止時就彎（正負隨機）；droop：越橫、越朝上的觸手越往下垂
    const curl=(r()-.5)*.6,droop=.15+.3*Math.max(0,-Math.sin(a));
    return{a,ux:Math.cos(a),uy:Math.sin(a),L:L*(.85+r()*.3),w:w*(.85+r()*.3),curl,droop,uExit:0}});
  for(const t of TENT){const b=blobR(t.a);t.uExit=Math.min(.8,Math.max(0,(b*.95-b*.35)/(t.L-b*.35)))}

function blobR(a){let d=a-PH[3];d=Math.atan2(Math.sin(d),Math.cos(d));

  return .78+.10*Math.sin(2*a+PH[0])+.07*Math.sin(3*a+PH[1])+.04*Math.sin(5*a+PH[2])+.24*Math.exp(-((d/.38)**2))}   // ×R，最後一項是頭頂鼓包
// 哪一條觸手、沿觸手的位置 u（0 根 1 尖）、到軸線距離
function tentHit(x,y){let best=null;
  for(let k=0;k<TENT.length;k++){const t=TENT[k],r0=blobR(t.a)*R*.35,sx=t.ux*r0,sy=t.uy*r0,ex=t.ux*t.L*R,ey=t.uy*t.L*R;
    const dx=ex-sx,dy=ey-sy,len2=dx*dx+dy*dy;let u=((x-sx)*dx+(y-sy)*dy)/len2;u=Math.max(0,Math.min(1,u));
    const px=sx+dx*u,py=sy+dy*u,d=Math.hypot(x-px,y-py),w=t.w*R*(1-.12*u);
    if(d<w&&(!best||d/w<best.q))best={k,u,q:d/w}}
  return best}
function inside(x,y){const a=Math.atan2(y,x);if(Math.hypot(x,y)<blobR(a)*R)return true;return tentHit(x,y)!==null}
function restR(a){const c=Math.cos(a),s=Math.sin(a),step=R/150;let last=0;
  for(let t=0;t<=R*2.6;t+=step)if(inside(c*t,s*t))last=t;return last}

function setup(){

function buildRungs(){
  // 觸手橫檔：一條觸手的邊界在環上是連續的一段，先沿一邊到尖端、再沿另一邊回來。
  // 把兩邊「沿觸手位置 u 最接近」的粒子配成一對（橫檔），記靜止寬度與左右手性（局部切線 × 橫檔向量的正負）。
  RUNGS=[];RS=[];RUNGREF=[];const nb=bnd.length;
  for(let k=0;k<TENT.length;k++){
    const pos=[];for(let r=0;r<nb;r++)if(TID[bnd[r]]===k)pos.push(r);
    if(pos.length<4){RUNGS.push([]);RS.push(1);RUNGREF.push([bnd[0],bnd[0]]);continue}
    const inRun=new Set(pos);let start=pos[0];for(const r of pos){if(!inRun.has((r+nb-1)%nb)){start=r;break}}
    const run=[];for(let m=0;m<pos.length;m++)run.push(bnd[(start+m)%nb]);
    let tipAt=0;for(let m=1;m<run.length;m++)if(TU[run[m]]>TU[run[tipAt]])tipAt=m;
    const A=run.slice(0,tipAt+1),B=run.slice(tipAt);
    const rungs=[];
    for(const a of A){let best=-1,bd=1e9;for(const b of B){if(b===a)continue;const d=Math.abs(TU[b]-TU[a]);if(d<bd){bd=d;best=b}}
      if(best<0)continue;const w0=Math.hypot(Q0X[best]-Q0X[a],Q0Y[best]-Q0Y[a]);if(w0<h*.9)continue;   // 尖端太窄，分不出左右，不配
      rungs.push({a,b:best,w0})}
    rungs.sort((p,q)=>TU[p.a]-TU[q.a]);
    let s=0;for(let r=0;r<rungs.length;r++){const p=rungs[Math.max(0,r-1)],q=rungs[Math.min(rungs.length-1,r+1)],g=rungs[r];
      const tx=Q0X[q.a]+Q0X[q.b]-Q0X[p.a]-Q0X[p.b],ty=Q0Y[q.a]+Q0Y[q.b]-Q0Y[p.a]-Q0Y[p.b];
      s+=Math.sign(tx*(Q0Y[g.b]-Q0Y[g.a])-ty*(Q0X[g.b]-Q0X[g.a]))}
    // 中軸每一節的靜止長度（給軸線不折返用）；根部參考點＝環上緊貼這段觸手兩端的身體粒子
    const ref=[bnd[(start+nb-1)%nb],bnd[(start+pos.length)%nb]];
    for(let r=0;r<rungs.length;r++){const g=rungs[r];let mx,my;
      if(r===0){mx=(Q0X[g.a]+Q0X[g.b]-Q0X[ref[0]]-Q0X[ref[1]])*.5;my=(Q0Y[g.a]+Q0Y[g.b]-Q0Y[ref[0]]-Q0Y[ref[1]])*.5}
      else{const p=rungs[r-1];mx=(Q0X[g.a]+Q0X[g.b]-Q0X[p.a]-Q0X[p.b])*.5;my=(Q0Y[g.a]+Q0Y[g.b]-Q0Y[p.a]-Q0Y[p.b])*.5}
      g.hs=Math.max(h*.3,Math.hypot(mx,my))}
    RUNGS.push(rungs);RS.push(s>=0?1:-1);RUNGREF.push(ref);
  }
}
function buildClusters(){
  // 區塊：重疊的圓，蓋滿身體。區塊越小越軟、越像果凍；越大越像一塊
  clusters=[];
  const cs=R*mat.cSpace,cr=R*mat.cRad;
  for(let cy=-2.6*R;cy<=2.6*R;cy+=cs)for(let cx=-2.6*R;cx<=2.6*R;cx+=cs){
    const idx=[];for(let i=0;i<N;i++)if(Math.hypot(Q0X[i]-cx,Q0Y[i]-cy)<cr)idx.push(i);
    if(idx.length>=5)clusters.push({idx:Int32Array.from(idx),w:1,cs:1,sn:0,xc:0,yc:0,qcx:0,qcy:0});
  }
  const all=[];for(let i=0;i<N;i++)all.push(i);
  globalC={idx:Int32Array.from(all),w:mat.wGlobal,cs:1,sn:0,xc:0,yc:0,qcx:0,qcy:0};
  clusters.push(globalC);
  lastC={cSpace:mat.cSpace,cRad:mat.cRad};
}

    if(f.mode==='grab'){const st=Math.hypot(ex,ey)/R,step=Math.floor(st*2.5);f.stretch=st;if(step>f.step&&st>.35)sfxPlay('pull',Math.min(1,.4+st/2),1-.08*Math.min(1,st/1.5));f.step=Math.max(f.step,step);
      // 按壓（接觸點先凹）：按下那幀先到目標的 pressFirst，之後用 pressRise 補完；按住不動（慢於每秒一個半徑）再慢慢攤深
      const still=Math.hypot(f.vxS,f.vyS)<R;f.hold=Math.max(0,Math.min(1,f.hold+(still?dt/Math.max(.05,mat.pressHoldTime):-dt/.3)));
      const target=R*(mat.pressBase+mat.pressHold*f.hold);
      if(!f.pressOn){f.press=target*mat.pressFirst;f.pressOn=true}else f.press+=(target-f.press)*(1-Math.exp(-dt/Math.max(.005,mat.pressRise)))}
  }
  // 候選 25 拉太遠滑脫：原始拉伸超過上限 1.2 倍持續 120 毫秒就脫手（抬起再按才抓得到），最重的放手音
  if(mat.slip>=.5){const gone=[];for(const f of fingers.values()){if(f.mode!=='grab')continue;const raw=Math.hypot(f.x-f.ax,f.y-f.ay)/R;
      if(raw>mat.maxPull*1.2){f.over+=dt;if(f.over>=.12)gone.push(f)}else f.over=0}
    for(const f of gone){for(const m of f.mem)GRAB[m[0]]=0;f.mem=[];f.mode='none';f.over=0;lastTouch=t;sfxPlay('release',1,1.1);if(![...fingers.values()].some(g=>g.mode==='grab'))sfxRub(0)}}
  // 第 24 條 兩指捏：兩根抓的手指距離縮到起始的 60% 發一次 squish（press 音＋觸覺），之後每再縮 15% 一次
  if(mat.pinchSquish>=.5){const gs=[];for(const f of fingers.values())if(f.mode==='grab')gs.push(f);
    if(gs.length>=2){const a=gs[0],b=gs[1],d=Math.hypot(a.x-b.x,a.y-b.y);
      if(PINCH.a!==a.id||PINCH.b!==b.id){PINCH.a=a.id;PINCH.b=b.id;PINCH.d0=Math.max(1,d);PINCH.next=.6}
      const r=d/PINCH.d0;if(r<=PINCH.next){sfxPlay('press',.6+.3*(1-r));PINCH.next-=.15}}
    else{PINCH.a=-1;PINCH.b=-1}}
  { // 持續揉：抓著時手指速度越快越大聲（用平滑速度，單幀差分會抖）
    let sp=0;for(const f of fingers.values())if(f.mode==='grab')sp=Math.max(sp,Math.hypot(f.vxS,f.vyS)/R);
    sfxRub(fingers.size?Math.min(1,sp/5)*.7:0)}
  // 活物感：沒人碰才開，放手後 1 秒內淡入
  const idle=fingers.size?0:Math.min(1,Math.max(0,(t-lastTouch-.8)/1.2));
  const L=idle*(REDUCED?.5:1);
  // 候選 19：碰到時活物感「凍住」不歸零。振幅不乘 L，只有時鐘停；L 照舊管搖、抖、遊走
  tLife+=dt*L;const freeze=mat.idleFreeze>=.5,Lamp=freeze?(REDUCED?.5:1):L,tl=freeze?tLife:t;
  { // 第 23 條 呼吸：相位用累積（週期可變不跳相）；對照值（3.8 秒正弦）跟原本一模一樣
    let T=mat.jelly>=.5?mat.jellyT:mat.breathT,amp=1;   // 水母呼吸用 jellyT
    if(mat.breathDeep>=.5){ // 23c 被摸久了呼吸變深：連續抓超過 10 秒，放手後 20 秒內振幅 ×1.5、週期 ×1.2 再線性衰減
      let grabbing=false;for(const f of fingers.values())if(f.mode==='grab')grabbing=true;
      if(grabbing){if(BR.grabStart<0)BR.grabStart=t}else{if(BR.grabStart>=0&&t-BR.grabStart>10)BR.deepAt=t;BR.grabStart=-1}
      const f=Math.max(0,1-(t-BR.deepAt)/20);amp=1+.5*f;T*=1+.2*f}
    BR.phase+=(tl-BR.tlPrev)/T;BR.tlPrev=tl;BR.amp=amp;
    const ph=BR.phase-Math.floor(BR.phase);
    BR.wave=mat.breathShape>=.5?(ph<.4?-Math.cos(Math.PI*ph/.4):ph<.95?Math.cos(Math.PI*(ph-.4)/.55):-1):Math.sin(2*Math.PI*ph)}   // 23b 吸 40%、吐 55%、停 5%
  // 水母呼吸（2026-11-01 多米：有規律的律動，像水母）：週期 jellyT，前 22% 快縮（sin 緩出）、後 78% 慢放（餘弦）；
  // 收縮時窄、高，寫進 BR.wave 跟原本的呼吸同一條路（參考形狀縮放）；每次收縮把 lift 往上推、放鬆時 1 秒時間常數沉回
  if(mat.jelly>=.5){const ph=BR.phase-Math.floor(BR.phase),c=.22,w=ph<c?Math.sin(Math.PI/2*ph/c):.5*(1+Math.cos(Math.PI*(ph-c)/(1-c)));
    const dw=w-BR.jw;BR.jw=w;BR.wave=-w;BR.amp=mat.jellyAmp/.045;
    if(dw>0)BR.lift+=dw*mat.jellyLift*R*Lamp*mat.life;BR.lift*=Math.exp(-dt/1.0)}
  else BR.lift*=Math.exp(-dt/1.0);
  // 偽足：生、伸、縮、死。adv 跟活物感一起走（碰到就停）
  {const adv=dt*L*mat.idlePace,P=POD.list;
    for(const q of P)q.p+=adv/q.D;
    for(let i=P.length-1;i>=0;i--)if(P[i].p>=1)P.splice(i,1);
    POD.clock+=adv;
    if(mat.pods>0&&P.length<Math.round(mat.pods)&&POD.clock>=POD.next){
      let a=0;for(let tr=0;tr<10;tr++){a=Math.random()*2*Math.PI;if(P.every(q=>Math.abs(Math.atan2(Math.sin(a-q.a),Math.cos(a-q.a)))>1.1))break}
      P.push({a,L:mat.podLen*(.7+.5*Math.random()),sig:.22+.1*Math.random(),bend:(Math.random()-.5)*.8,D:4+4*Math.random(),p:0});
      POD.next=POD.clock+.8+2.2*Math.random()}
    POD.E=P.map(q=>{const e=q.p<.4?(x=>x*x*(3-2*x))(q.p/.4):q.p<.6?1:(x=>x*x*(3-2*x))((1-q.p)/.4);
      return{ca:Math.cos(q.a),sa:Math.sin(q.a),amp:q.L*R*e*(REDUCED?.5:1),sig:q.sig,bend:q.bend}});
    // 面積補償：沿參考形狀的邊界算偽足多出來的面積 ∮ r·Δr dθ，再整圈按同一個權重 (r/Rb)² 往內收同樣的量（只扣各自平均量過：放著 20 秒面積多 4.8%）
    POD.shift=0;if(POD.E.length){const Rb=R*.98,nb=bnd.length;let num=0,den=0;
      for(let k=0;k<nb;k++){const i=bnd[k],j=bnd[(k+1)%nb],h0=bnd[(k+nb-1)%nb],x=QX[i],y=QY[i],r=Math.hypot(x,y);if(r<1e-6)continue;
        const dth=Math.abs(Math.atan2(QX[h0]*QY[j]-QY[h0]*QX[j],QX[h0]*QX[j]+QY[h0]*QY[j]))/2,c1=x/r,s1=y/r,rn=Math.min(1.6,(r/Rb)**2);let dr=0;
        for(const q of POD.E){const da=Math.atan2(s1*q.ca-c1*q.sa,c1*q.ca+s1*q.sa);dr+=q.amp*Math.exp(-da*da/(2*q.sig*q.sig))*rn}
        num+=(r*dr+dr*dr/2)*dth;den+=(r+dr)*rn*dth}   // 二階一起算：只算一階，偽足伸長時面積還是多 3%
      POD.shift=den>0?num/den:0}}
  // 活物：遊走。沒碰時家會慢慢移動，走一段、停一下；碰它就停在原地
  // 第 20 條：走一段用 smoothstep 加減速（速度剖面 6p(1−p)，平均速度與走停節奏不變）；減少動態時速度再減半（第 31 條，連 L 的一半合計 ×0.25）
  WANDER.vx=0;WANDER.vy=0;
  if(L>.5&&mat.wander>0){
    if(!WANDER.moving&&t>WANDER.next){WANDER.sx=HOMEX;WANDER.sy=HOMEY;WANDER.dx=CX+(Math.random()-.5)*W*.36;WANDER.dy=CY+(Math.random()-.5)*H*.16;
      WANDER.T=Math.max(.5,Math.hypot(WANDER.dx-HOMEX,WANDER.dy-HOMEY)/(mat.wander*R*(REDUCED?.5:1)));WANDER.p=0;WANDER.moving=true}
    if(WANDER.moving){WANDER.p=Math.min(1,WANDER.p+dt*L/WANDER.T);const p=WANDER.p,e=p*p*(3-2*p);
      const nx=WANDER.sx+(WANDER.dx-WANDER.sx)*e,ny=WANDER.sy+(WANDER.dy-WANDER.sy)*e;
      WANDER.vx=(nx-HOMEX)/dt;WANDER.vy=(ny-HOMEY)/dt;HOMEX=nx;HOMEY=ny;
      if(p>=1){WANDER.moving=false;WANDER.next=t+1.5+Math.random()*5}}
  }else if(fingers.size){WANDER.moving=false;WANDER.next=t+2+Math.random()*3}
  if(mat.morph>=.5)morphCoef(tl*mat.idlePace);   // idlePace：自己動的快慢（2026-11-01 多米：蠕動別那麼快）
  const sdt=dt/SUB;
  for(let s=0;s<SUB;s++)substep(sdt,L,Lamp,tl);
  plasticity(dt);
  twitch(L);
}

/* ---------- 繪圖（平塗卡通） ---------- */
function bodyPath(P,ox=0,oy=0){const n=P.length;ctx.beginPath();
  for(let i=0;i<n;i++){const p0=P[(i+n-1)%n],p1=P[i],p2=P[(i+1)%n],p3=P[(i+2)%n];
    if(i===0)ctx.moveTo(p1[0]+ox,p1[1]+oy);
    const c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6,c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;
    ctx.bezierCurveTo(c1x+ox,c1y+oy,c2x+ox,c2y+oy,p2[0]+ox,p2[1]+oy)}
  ctx.closePath()}
function boundaryPts(){const n=bnd.length,P=new Array(n);
  for(let i=0;i<n;i++){const a=bnd[(i+n-1)%n],b=bnd[i],c=bnd[(i+1)%n];
    P[i]=[X[a]*.25+X[b]*.5+X[c]*.25,Y[a]*.25+Y[b]*.5+Y[c]*.25]}return P}
// 候選 34 描邊粗細隨壓縮：邊界每一段的粗細跟壓縮比走（相鄰粒子距離 ÷ 靜止距離 0.6 時 1.3 倍、2.4 時 0.8 倍）。
// 一條路徑只能有一種粗細，所以沿曲線取樣、往法線兩側偏移成一圈帶狀多邊形當填色（2D 動畫的墨水堆積）
function inkWidths(lw){const n=bnd.length,w=new Float64Array(n);
  for(let i=0;i<n;i++){const a=bnd[i],b=bnd[(i+1)%n];const c=Math.hypot(X[b]-X[a],Y[b]-Y[a])/Math.max(1e-6,Math.hypot(Q0X[b]-Q0X[a],Q0Y[b]-Q0Y[a]));
    const f=c<1?1+.3*Math.min(1,(1-c)/.4):1-.2*Math.min(1,(c-1)/1.4);w[i]=lw*(1+mat.inkVar*(f-1))}
  return w}
function inkBand(P,lw){const n=P.length,w=inkWidths(lw),S=3,outer=[],inner=[];
  for(let i=0;i<n;i++){const p0=P[(i+n-1)%n],p1=P[i],p2=P[(i+1)%n],p3=P[(i+2)%n];
    const c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6,c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;
    const wa=(w[(i+n-1)%n]+w[i])*.5,wb=(w[i]+w[(i+1)%n])*.5;   // 點 i 的粗細＝鄰接兩段平均，再沿曲線內插
    for(let s=0;s<S;s++){const u=s/S,mu=1-u;
      const bx=mu*mu*mu*p1[0]+3*mu*mu*u*c1x+3*mu*u*u*c2x+u*u*u*p2[0],by=mu*mu*mu*p1[1]+3*mu*mu*u*c1y+3*mu*u*u*c2y+u*u*u*p2[1];
      let tx=3*mu*mu*(c1x-p1[0])+6*mu*u*(c2x-c1x)+3*u*u*(p2[0]-c2x),ty=3*mu*mu*(c1y-p1[1])+6*mu*u*(c2y-c1y)+3*u*u*(p2[1]-c2y);
      const tl=Math.hypot(tx,ty)||1e-6;tx/=tl;ty/=tl;const hw=(wa+(wb-wa)*u)*.5;
      outer.push([bx-ty*hw,by+tx*hw]);inner.push([bx+ty*hw,by-tx*hw])}}
  ctx.beginPath();ctx.moveTo(outer[0][0],outer[0][1]);for(let k=1;k<outer.length;k++)ctx.lineTo(outer[k][0],outer[k][1]);ctx.closePath();
  ctx.moveTo(inner[inner.length-1][0],inner[inner.length-1][1]);for(let k=inner.length-2;k>=0;k--)ctx.lineTo(inner[k][0],inner[k][1]);ctx.closePath()}
function draw(){
  const css=getComputedStyle(document.documentElement),col=n=>css.getPropertyValue(n).trim();
  ctx.clearRect(0,0,W,H);
  // 背景
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,col('--sky'));g.addColorStop(1,col('--sky2'));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(!FLOAT){ctx.fillStyle=col('--grass');ctx.fillRect(0,GROUND,W,H-GROUND);ctx.fillStyle=col('--grass-line');ctx.fillRect(0,GROUND,W,3)}
  const P=boundaryPts();
  let minX=1e9,maxX=-1e9,maxY=-1e9,cx=globalC.xc,cy=globalC.yc;
  for(const p of P){minX=Math.min(minX,p[0]);maxX=Math.max(maxX,p[0]);maxY=Math.max(maxY,p[1])}
  // 影子
  const sw=(maxX-minX)*.5,sy=FLOAT?Math.max(maxY,CY+R*1.2)+R*.35:GROUND+10;
  const lift=FLOAT?Math.max(0,Math.min(1,(sy-maxY)/(R*1.2))):0;
  ctx.fillStyle=`rgba(60,90,40,${FLOAT?.10+.08*(1-lift):.16})`;
  ctx.beginPath();ctx.ellipse(cx,sy,sw*(FLOAT?.7+.3*(1-lift):1.05),R*.11*(FLOAT?.8:1),0,0,Math.PI*2);ctx.fill();
  ctx.save();
  if(!FLOAT){ctx.beginPath();ctx.rect(0,0,W,GROUND+2);ctx.clip()}
  // 身體：陰影色打底，再用往左上偏移的底色蓋住
  bodyPath(P);ctx.fillStyle=col('--shade');ctx.fill();
  ctx.save();bodyPath(P);ctx.clip();bodyPath(P,-R*.07,-R*.085);ctx.fillStyle=col('--body');ctx.fill();
  // 亮光：綁在左上粒子，跟著整體旋轉
  const hx=X[hiIdx],hy=Y[hiIdx],ang=Math.atan2(globalC.sn,globalC.cs);
  ctx.fillStyle=col('--hi');
  ctx.beginPath();ctx.ellipse(hx,hy,R*.17,R*.085,ang-.5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(hx+Math.cos(ang-.2)*R*.26,hy+Math.sin(ang-.2)*R*.26,R*.035,0,Math.PI*2);ctx.fill();
  ctx.restore();
  // 描邊
  if(mat.inkVar>0){ctx.fillStyle=col('--line');inkBand(P,Math.max(4,R*.034));ctx.fill()}   // 候選 34：描邊粗細隨壓縮
  else{bodyPath(P);ctx.lineWidth=Math.max(4,R*.034);ctx.lineJoin='round';ctx.strokeStyle=col('--line');ctx.stroke()}
  ctx.restore();
}

/* ---------- 主迴圈 ---------- */
function frame(now){
  const dt=Math.min(1/30,Math.max(1/240,(now-last)/1000||1/60));last=now;
  update(dt);draw();requestAnimationFrame(frame);
}

/* ---------- UI ---------- */
function setMat(name){mat={...PRESETS[name]};curMat=name;for(const k of ['jelly','mochi','clay'])$('m-'+k).setAttribute('aria-pressed',String(k===name));syncSliders()}
for(const k of ['jelly','mochi','clay'])$('m-'+k).addEventListener('click',()=>setMat(k));
$('b-reset').addEventListener('click',()=>{relax()});   // 揉回原形：用動畫不瞬移（換種子才走 setup）
$('b-float').addEventListener('click',()=>{FLOAT=!FLOAT;$('b-float').setAttribute('aria-pressed',String(FLOAT));$('b-float').textContent=FLOAT?'懸空（多米定案）':'地面（對照用）';setup();dump()});
// 隱藏面板：長按標題 1.2 秒
let pressT=null;
$('brand').addEventListener('pointerdown',()=>{pressT=setTimeout(()=>{$('tune').classList.toggle('hidden')},1200)});
for(const ev of ['pointerup','pointerleave','pointercancel'])$('brand').addEventListener(ev,()=>clearTimeout(pressT));
$('t-close').addEventListener('click',()=>$('tune').classList.add('hidden'));
$('t-copy').addEventListener('click',()=>{const s=$('t-out').value;navigator.clipboard&&navigator.clipboard.writeText(s)});
// 第二批候選（網頁版只有這三條；觸覺類在 Swift 版）。一次只套一條，先記下對照值再比
$('cands').addEventListener('click',e=>{const c=e.target.getAttribute('data-c');if(!c)return;
  if(c==='6')mat.lag=.03;else if(c==='19')mat.idleFreeze=1;else if(c==='2')mat.specialEvery=8;else if(c==='41'){mat.tentRung=0;mat.tentAxis=0}else if(c==='21')mat.homeK=.003;else if(c==='22')mat.afterglow=.25;else if(c==='23'){mat.breathT=6;mat.breathShape=1;mat.breathDeep=1}else if(c==='25')mat.slip=1;else if(c==='26')mat.stick=.1;else if(c==='27')mat.localArea=1;else if(c==='33')mat.homeFrac=.46;else if(c==='34')mat.inkVar=1;else if(c==='27v')Object.assign(mat,V27[curMat]||{})
  for(const k of ['jelly','mochi','clay'])$('m-'+k).setAttribute('aria-pressed','false');syncSliders()});
const sl={};
(function buildSliders(){const host=$('sliders');
  for(const [key,name,hint,min,max,step] of F){
    const lab=document.createElement('label');
    lab.innerHTML=`<span>${name}</span><output></output><small>${hint}</small><input type="range" min="${min}" max="${max}" step="${step}">`;
    const inp=lab.querySelector('input'),out=lab.querySelector('output');
    inp.addEventListener('input',()=>{mat[key]=parseFloat(inp.value);out.textContent=inp.value;dump();
      for(const k of ['jelly','mochi','clay'])$('m-'+k).setAttribute('aria-pressed','false')});
    host.appendChild(lab);sl[key]={inp,out};
  }})();
function syncSliders(){for(const k in sl){sl[k].inp.value=mat[k];sl[k].out.textContent=String(mat[k])}dump()}
function dump(){$('t-out').value=JSON.stringify({...mat,float:FLOAT})}

addEventListener('resize',()=>{setup()});
setup();syncSliders();requestAnimationFrame(frame);
</script>
